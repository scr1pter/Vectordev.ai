<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vector Design Lab</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/lab.css" />
    <style>
      .d-plugins-marketplace .app-main {
        position: relative;
      }

      .d-plugins-marketplace .app-body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .d-plugins-marketplace input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      .d-plugins-marketplace .btn:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .d-plugins-marketplace .tile {
        display: grid;
        flex: none;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
        color: var(--text-2);
      }

      .d-plugins-marketplace .tile-lg {
        width: 46px;
        height: 46px;
        border-radius: 11px;
      }

      .d-plugins-marketplace .spin {
        animation: pm-spin 0.9s linear infinite;
      }

      @keyframes pm-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Top strip */
      .d-plugins-marketplace .p-top {
        display: flex;
        flex: none;
        align-items: flex-end;
        gap: 10px;
        height: 47px;
        padding: 0 14px 0 12px;
        border-bottom: 1px solid var(--hairline);
      }

      .d-plugins-marketplace .p-top .tabs {
        height: 46px;
        padding: 0;
        border: 0;
      }

      .d-plugins-marketplace .tab .count {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
      }

      .d-plugins-marketplace .tab[aria-selected="true"] .count {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-plugins-marketplace .p-top-end {
        display: flex;
        align-items: center;
        gap: 8px;
        align-self: center;
        margin-left: auto;
      }

      .d-plugins-marketplace .p-top-end .input {
        width: 250px;
        height: 28px;
      }

      .d-plugins-marketplace .p-grid {
        display: grid;
        flex: 1;
        grid-template-columns: 196px 1fr 432px;
        min-height: 0;
      }

      /* Category rail */
      .d-plugins-marketplace .p-rail {
        padding: 12px 8px;
        border-right: 1px solid var(--hairline);
      }

      .d-plugins-marketplace .p-rail .section-title {
        margin: 6px 10px 8px;
      }

      .d-plugins-marketplace .rail-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 9px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-2);
        font-size: 12.5px;
        text-align: left;
      }

      .d-plugins-marketplace .rail-item:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-1);
      }

      .d-plugins-marketplace .rail-item[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-1);
      }

      .d-plugins-marketplace .rail-item[aria-pressed="true"] svg {
        color: var(--violet-bright);
      }

      .d-plugins-marketplace .rail-item svg {
        flex: none;
        color: var(--text-3);
      }

      .d-plugins-marketplace .rail-item.is-empty {
        color: #6f6c77;
      }

      .d-plugins-marketplace .rail-item .n {
        margin-left: auto;
        color: var(--text-3);
        font: 10.5px var(--mono);
      }

      .d-plugins-marketplace .rail-note {
        margin: 18px 10px 0;
        padding-top: 14px;
        border-top: 1px solid var(--hairline);
        color: var(--text-3);
        font-size: 11.5px;
        line-height: 1.5;
      }

      .d-plugins-marketplace .rail-note code {
        color: var(--text-2);
        font: 11px var(--mono);
      }

      /* Results */
      .d-plugins-marketplace .p-results {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--line);
      }

      .d-plugins-marketplace .p-sum {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 14px 18px 8px;
        color: var(--text-2);
        font-size: 13px;
      }

      .d-plugins-marketplace .p-sum > span:first-child {
        flex: 1;
      }

      .d-plugins-marketplace .p-sum .seg button {
        height: 22px;
        padding: 0 9px;
        font-size: 11.5px;
      }

      .d-plugins-marketplace .p-list {
        flex: 1;
        min-height: 0;
        padding: 0 8px 14px;
      }

      .d-plugins-marketplace .featured {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 4px 4px 10px;
      }

      .d-plugins-marketplace .feat {
        display: grid;
        gap: 8px;
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: radial-gradient(240px 90px at 0% 0%, rgba(182, 159, 247, 0.09), transparent 70%), var(--card);
        color: var(--text-1);
        text-align: left;
      }

      .d-plugins-marketplace .feat:hover {
        border-color: var(--line-strong);
      }

      .d-plugins-marketplace .feat[aria-pressed="true"] {
        border-color: var(--violet-line);
      }

      .d-plugins-marketplace .feat-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .d-plugins-marketplace .feat-top .row-text {
        gap: 1px;
      }

      .d-plugins-marketplace .feat p {
        margin: 0;
        color: var(--text-2);
        font-size: 12px;
        line-height: 1.45;
      }

      .d-plugins-marketplace .feat-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-3);
        font: 11px var(--mono);
      }

      .d-plugins-marketplace .p-group {
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 10px 10px 6px;
        color: var(--text-3);
        font-size: 11.5px;
      }

      .d-plugins-marketplace .p-group .mono {
        font-size: 11px;
      }

      .d-plugins-marketplace .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-right: 12px;
        border-radius: 7px;
      }

      .d-plugins-marketplace .item:hover {
        background: rgba(255, 255, 255, 0.035);
      }

      .d-plugins-marketplace .item[aria-selected="true"] {
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .d-plugins-marketplace .item[aria-selected="true"] .tile {
        border-color: var(--violet-line);
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-plugins-marketplace .item-main {
        display: flex;
        flex: 1;
        min-width: 0;
        align-items: center;
        gap: 11px;
        min-height: 52px;
        padding: 7px 0 7px 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        text-align: left;
      }

      .d-plugins-marketplace .item-name {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        color: var(--text-1);
        font-size: 13px;
      }

      .d-plugins-marketplace .item-name .by {
        overflow: hidden;
        color: var(--text-3);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d-plugins-marketplace .kind {
        height: 17px;
        padding: 0 6px;
        font-size: 10px;
      }

      .d-plugins-marketplace .item.is-off .item-name,
      .d-plugins-marketplace .item.is-off .tile {
        opacity: 0.55;
      }

      .d-plugins-marketplace .item-end {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        color: var(--text-3);
        font: 11.5px var(--mono);
      }

      .d-plugins-marketplace .item-end .badge {
        font-family: var(--font);
      }

      .d-plugins-marketplace .verified {
        display: inline-flex;
        color: var(--violet-bright);
        vertical-align: -2px;
      }

      .d-plugins-marketplace .p-empty {
        display: grid;
        place-items: center;
        gap: 6px;
        padding: 60px 20px;
        color: var(--text-3);
        text-align: center;
      }

      .d-plugins-marketplace .p-empty strong {
        color: var(--text-1);
        font-weight: 500;
      }

      /* Detail */
      .d-plugins-marketplace .p-detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--panel);
      }

      .d-plugins-marketplace .pd-head {
        display: flex;
        gap: 14px;
        padding: 20px 20px 14px;
      }

      .d-plugins-marketplace .pd-head .row-text {
        gap: 5px;
      }

      .d-plugins-marketplace .pd-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .d-plugins-marketplace .pd-title h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .d-plugins-marketplace .pd-sub {
        color: var(--text-3);
        font-size: 12px;
      }

      .d-plugins-marketplace .pd-sub b {
        color: var(--text-2);
        font-weight: 500;
      }

      .d-plugins-marketplace .pd-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 20px 16px;
        border-bottom: 1px solid var(--hairline);
      }

      .d-plugins-marketplace .pd-actions .grow {
        flex: 1;
      }

      .d-plugins-marketplace .pd-actions .seg button {
        height: 24px;
      }

      .d-plugins-marketplace .pd-switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-2);
        font-size: 12.5px;
      }

      .d-plugins-marketplace .btn-text-danger {
        color: #f0b0b3;
      }

      .d-plugins-marketplace .steps {
        display: grid;
        flex: 1;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
      }

      .d-plugins-marketplace .steps li {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-3);
      }

      .d-plugins-marketplace .steps li.is-done {
        color: var(--text-2);
      }

      .d-plugins-marketplace .steps li.is-done svg {
        color: var(--green);
      }

      .d-plugins-marketplace .steps li.is-now {
        color: var(--text-1);
      }

      .d-plugins-marketplace .steps .mono {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d-plugins-marketplace .steps .ph {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: 50%;
      }

      .d-plugins-marketplace .pd-body {
        flex: 1;
        min-height: 0;
        padding: 16px 20px 20px;
      }

      .d-plugins-marketplace .pd-body > p {
        margin: 0 0 18px;
        color: var(--text-2);
        font-size: 13px;
        line-height: 1.55;
      }

      .d-plugins-marketplace .pd-sec {
        margin-bottom: 20px;
      }

      .d-plugins-marketplace .pd-sec-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .d-plugins-marketplace .pd-sec-head .section-title {
        margin: 0;
      }

      .d-plugins-marketplace .pd-sec-head .muted {
        margin-left: auto;
        font-size: 11.5px;
      }

      .d-plugins-marketplace .adds {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .d-plugins-marketplace .add-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.025);
        color: var(--text-1);
        font: 11.5px var(--mono);
      }

      .d-plugins-marketplace .add-chip span {
        color: var(--text-3);
        font-family: var(--font);
        font-size: 11px;
      }

      .d-plugins-marketplace .perms {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--card);
      }

      .d-plugins-marketplace .perm + .perm {
        border-top: 1px solid var(--hairline);
      }

      .d-plugins-marketplace .perm-btn {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        padding: 7px 12px;
        border: 0;
        background: transparent;
        text-align: left;
      }

      .d-plugins-marketplace .perm-btn:hover {
        background: rgba(255, 255, 255, 0.025);
      }

      .d-plugins-marketplace .perm-btn > svg:last-child {
        flex: none;
        color: var(--text-3);
        transition: transform 160ms ease;
      }

      .d-plugins-marketplace .perm-btn[aria-expanded="true"] > svg:last-child {
        transform: rotate(90deg);
      }

      .d-plugins-marketplace .risk {
        display: grid;
        flex: none;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-2);
      }

      .d-plugins-marketplace .risk.is-med {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .d-plugins-marketplace .risk.is-high {
        background: var(--red-soft);
        color: var(--red);
      }

      .d-plugins-marketplace .perm .row-sub.mono {
        font-size: 11px;
      }

      .d-plugins-marketplace .perm-detail {
        margin: 0;
        padding: 0 14px 12px 48px;
        color: var(--text-2);
        font-size: 12px;
        line-height: 1.5;
      }

      .d-plugins-marketplace .code {
        display: grid;
        padding: 8px 0;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 7px;
        background: #121117;
        font: 11.5px/19px var(--mono);
      }

      .d-plugins-marketplace .code code {
        display: grid;
        grid-template-columns: 30px 1fr;
        overflow: hidden;
        color: #d8d4de;
        white-space: pre;
      }

      .d-plugins-marketplace .code code > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .d-plugins-marketplace .code code::before {
        content: attr(data-n);
        padding-right: 10px;
        color: #5e5b66;
        text-align: right;
      }

      .d-plugins-marketplace .code .k {
        color: #b69ff7;
      }

      .d-plugins-marketplace .code .s {
        color: #a8e2bf;
      }

      .d-plugins-marketplace .code .c {
        color: #75727d;
      }

      .d-plugins-marketplace .code .is-add {
        background: rgba(101, 199, 142, 0.1);
      }

      .d-plugins-marketplace .notes {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
        color: var(--text-2);
        font-size: 12.5px;
        line-height: 1.45;
      }

      .d-plugins-marketplace .notes li {
        display: flex;
        gap: 8px;
      }

      .d-plugins-marketplace .notes li::before {
        content: "";
        flex: none;
        width: 4px;
        height: 4px;
        margin-top: 7px;
        border-radius: 50%;
        background: var(--violet-bright);
      }

      .d-plugins-marketplace .facts {
        display: grid;
        grid-template-columns: 0.7fr 2fr 0.9fr;
        border: 1px solid var(--line);
        border-radius: 9px;
      }

      .d-plugins-marketplace .facts div {
        display: grid;
        gap: 4px;
        padding: 10px 12px;
      }

      .d-plugins-marketplace .facts div + div {
        border-left: 1px solid var(--hairline);
      }

      .d-plugins-marketplace .facts span {
        color: var(--text-3);
        font-size: 11px;
      }

      .d-plugins-marketplace .facts b {
        color: var(--text-1);
        font: 500 12.5px var(--mono);
      }

      .d-plugins-marketplace .confirm {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        color: #f0b0b3;
        font-size: 12.5px;
      }

      .d-plugins-marketplace .confirm span {
        flex: 1;
      }

      /* Toast */
      .d-plugins-marketplace .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        color: var(--text-1);
        font-size: 12.5px;
        transform: translateX(-50%);
        animation: pm-rise 220ms var(--ease);
      }

      .d-plugins-marketplace .toast[hidden] {
        display: none;
      }

      .d-plugins-marketplace .toast svg {
        color: var(--green);
      }

      @keyframes pm-rise {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="lab-page">
      <header data-lab-topbar data-slug="plugins-marketplace"></header>

      <div class="lab-window">
        <div class="lab-bar">
          <span class="lab-traffic" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="lab-bar-title">Vector</span>
          <span class="lab-bar-end"><i></i> Concept</span>
        </div>
        <div class="lab-viewport" data-height="900">
          <div class="lab-stage d-plugins-marketplace">
            <div class="app">
              <nav data-lab-sidebar data-active="plugins" data-workspace="Vector" data-branch="main"></nav>
              <main class="app-main">
                <header class="app-header">
                  <i data-icon="plugins" data-size="15" class="muted"></i>
                  <h2>Plugins</h2>
                  <span class="app-header-sub">Plugins, skills and agents for Vectordev.ai</span>
                  <div class="app-header-end">
                    <button class="btn btn-ghost" type="button" data-act="from-npm"><i data-icon="terminal" data-size="14"></i>Install from npm</button>
                    <button class="btn" type="button" data-act="new-skill"><i data-icon="plus" data-size="14"></i>New skill</button>
                  </div>
                </header>
                <div class="app-body">
                  <div class="p-top">
                    <div class="tabs" role="tablist" aria-label="Plugins view" data-views></div>
                    <div class="p-top-end">
                      <label class="input"><i data-icon="search" data-size="14" class="muted"></i><input type="search" placeholder="Search plugins, skills, agents" aria-label="Search" data-q /></label>
                    </div>
                  </div>
                  <div class="p-grid">
                    <nav class="p-rail scroll" aria-label="Categories" data-rail></nav>
                    <section class="p-results" aria-label="Results">
                      <div class="p-sum" data-sum></div>
                      <div class="p-list scroll" role="listbox" aria-label="Plugins" data-list></div>
                    </section>
                    <section class="p-detail" aria-label="Details" data-detail></section>
                  </div>
                </div>
                <div class="toast float" role="status" hidden data-toast></div>
              </main>
            </div>
          </div>
        </div>
      </div>

      <p class="lab-note" data-lab-note></p>
    </div>

    <script src="../assets/icons.js"></script>
    <script src="../assets/links.js"></script>
    <script src="../assets/registry/review.js"></script>
    <script src="../assets/registry/connections.js"></script>
    <script src="../assets/registry/settings.js"></script>
    <script src="../assets/registry/agents.js"></script>
    <script src="../assets/lab.js"></script>
    <script>
      ;(function () {
        const root = document.querySelector(".d-plugins-marketplace")
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
        const icon = (name, size = 14, cls = "") => `<i data-icon="${name}" data-size="${size}"${cls ? ` class="${cls}"` : ""}></i>`
        const svg = (d, size = 14) => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        // Kind glyphs: plug for plugins, book for skills, spark for agents.
        const glyph = {
          plugin: (s = 16) => svg("M6 2v3M10 2v3M4.5 5h7v2.2A3.5 3.5 0 0 1 8 10.7 3.5 3.5 0 0 1 4.5 7.2V5ZM8 10.7V14", s),
          skill: (s = 16) => svg("M3 3.2c1.8-.6 3.5-.4 5 .8 1.5-1.2 3.2-1.4 5-.8v9.4c-1.8-.6-3.5-.4-5 .8-1.5-1.2-3.2-1.4-5-.8V3.2ZM8 4v9.4", s),
          agent: (s = 16) => svg("M8 2.2 9.3 6.7 13.8 8 9.3 9.3 8 13.8 6.7 9.3 2.2 8 6.7 6.7 8 2.2Z", s),
        }
        const check = svg("M3.5 8.4 6.6 11.4 12.5 4.8", 13)
        const shield = svg("M8 2 13 3.8V8c0 3-2.2 5.1-5 6-2.8-.9-5-3-5-6V3.8L8 2Z", 14)
        const eye = svg("M1.8 8s2.3-4.2 6.2-4.2S14.2 8 14.2 8 11.9 12.2 8 12.2 1.8 8 1.8 8ZM8 9.9a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z", 14)
        const bolt = svg("M8.8 2 4 9h4l-.8 5L12 7H8l.8-5Z", 14)
        const net = svg("M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12ZM2.4 6h11.2M2.4 10h11.2M8 2c-2.2 2.9-2.2 9.1 0 12M8 2c2.2 2.9 2.2 9.1 0 12", 14)

          const label = state.view === "installed" ? `${list.length}${noun} installed` : state.view === "updates" ? `${list.length} ${list.length === 1 ? "update" : "updates"} available` : `${list.length}${noun} in the catalog`
          root.querySelector("[data-sum]").innerHTML = `<span>${label}</span>
            ${state.view === "updates" && updates.length ? `<button class="btn btn-sm btn-primary" type="button" data-act="update-all">Update all</button>` : ""}
            <div class="seg" role="group" aria-label="Kind" data-kinds>${kinds.map(([id, l]) => `<button type="button" data-value="${id}" aria-pressed="${state.kind === id}">${l}</button>`).join("")}</div>`
          const el = root.querySelector("[data-list]")
          if (!list.length) {
            el.innerHTML = `<div class="p-empty">${glyph.plugin(18)}<strong>${state.view === "updates" ? "Everything is up to date" : "Nothing matches"}</strong><span>${state.view === "updates" ? "Vector checks for new versions when it starts." : state.cat !== "all" ? `Nothing in ${cats.find((c) => c[0] === state.cat)[1]}${state.q ? ` for “${esc(state.q)}”` : ""}.` : "Try another search."}</span>${state.cat !== "all" && state.view !== "updates" ? `<button class="btn btn-sm" type="button" data-cat="all" style="margin-top:6px">Search all categories</button>` : ""}</div>`
            return
          }
          const showFeatured = state.view === "discover" && state.cat === "all" && state.kind === "all" && !state.q
          const featured = items.filter((i) => i.featured)
          const groups =
            state.view === "discover"
              ? [
                  ["Available", list.filter((i) => !i.installed)],
                  ["Installed", list.filter((i) => i.installed)],
                ]
              : [
                  ["Plugins", list.filter((i) => i.kind === "plugin")],
                  ["Skills", list.filter((i) => i.kind === "skill")],
                  ["Agents", list.filter((i) => i.kind === "agent")],
                ]
          el.innerHTML = `${
            showFeatured
              ? `<p class="p-group"><span>Made for Vector</span></p><div class="featured">${featured
                  .slice(0, 2)
                  .map(
                    (it) => `<button class="feat" type="button" data-pick="${it.id}" aria-pressed="${state.sel === it.id}">
                    <span class="feat-top"><span class="tile">${glyph[it.kind]()}</span><span class="row-text"><span class="row-name">${esc(it.name)}</span><span class="row-sub">${kindLabel[it.kind]} · by ${esc(it.author)}</span></span></span>
                    <p>${esc(it.desc)}</p>
                    <span class="feat-meta"><span>${it.installs} installs</span><span>·</span><span>v${it.latest ?? it.version}</span>${it.installed ? `<span class="badge badge-green" style="margin-left:auto;font-family:var(--font)">Installed</span>` : ""}</span>
                  </button>`,
                  )
                  .join("")}</div>`
              : ""
          }${groups
            .filter(([, g]) => g.length)
            .map(([label, g]) => `<p class="p-group"><span>${label}</span><span class="mono">${g.length}</span></p>${g.map(itemRow).join("")}`)
            .join("")}`
        }

        function actions(it) {
          if (state.install?.id === it.id) {
            const steps = it.kind === "plugin"
              ? [`Resolving ${it.spec}@${it.latest ?? it.version}`, "Installing into ~/.cache/vector/plugins", "Loading hooks"]
              : it.kind === "skill"
                ? [`Downloading ${it.name} from the skills index`, "Writing SKILL.md and files", "Adding to available skills"]
                : [`Writing ${it.spec}`, "Checking its permission rules", "Adding @" + it.name + " to the agent list"]
            const lbl = state.install.update ? "Updating" : "Installing"
            return `<ol class="steps" aria-label="${lbl}">${steps
              .map((s, i) => {
                const st = i < state.install.step ? "is-done" : i === state.install.step ? "is-now" : ""
                return `<li class="${st}">${st === "is-done" ? check : st === "is-now" ? icon("ring", 13, "spin") : `<span class="ph"></span>`}<span class="mono">${esc(s)}</span></li>`
              })
              .join("")}</ol>`
          }
          if (state.confirm) {
            return `<div class="confirm"><span>Remove ${esc(it.name)} from ${it.scope === "global" ? "~/.config/vector" : "vector.json"}? New sessions will not load it.</span><button class="btn btn-sm" type="button" data-act="cancel-remove">Keep</button><button class="btn btn-sm btn-danger" type="button" data-act="remove">Uninstall</button></div>`
          }
          if (!it.installed) {
            return `<button class="btn btn-primary" type="button" data-act="install">${icon("plus", 13)}Install${it.builtin ? "" : ` ${kindLabel[it.kind].toLowerCase()}`}</button>
              ${it.builtin ? "" : `<div class="seg" role="group" aria-label="Install for" data-scope><button type="button" data-value="project" aria-pressed="${state.scope === "project"}">This project</button><button type="button" data-value="global" aria-pressed="${state.scope === "global"}">Everywhere</button></div>`}
              <span class="grow"></span>`
          }
          return `${it.latest ? `<button class="btn btn-primary" type="button" data-act="update">Update to ${it.latest}</button>` : ""}
            <span class="pd-switch"><button class="switch" type="button" role="switch" aria-checked="${it.enabled}" aria-label="Enable ${esc(it.name)}" data-sw="enable"></button>${it.enabled ? "Enabled" : "Disabled"}</span>
            <span class="grow"></span>
            ${it.builtin ? `<span class="muted" style="font-size:12px">Ships with Vector</span>` : `<button class="btn btn-ghost btn-sm btn-text-danger" type="button" data-act="ask-remove">${icon("trash", 13)}Uninstall</button>`}`
        }

        function sourceBlock(it) {
          if (it.kind === "skill" && it.skillmd) return ["SKILL.md", it.skillmd.map((l) => (l.startsWith("---") || l.startsWith("#") ? `<span class="c">${esc(l)}</span>` : esc(l).replace(/^(\s*)([a-z]+):/, '$1<span class="k">$2</span>:')))]
          if (it.kind === "agent" && it.agentmd) return [it.builtin ? "built-in agent" : it.spec, it.agentmd.map((l) => (l.startsWith("---") || l.startsWith("#") ? `<span class="c">${esc(l)}</span>` : esc(l).replace(/^(\s*)([a-z]+):/, '$1<span class="k">$2</span>:')))]
          if (it.builtin) return null
          const where = (it.installed ? it.scope : state.scope) === "global" ? "~/.config/vector/vector.json" : "vector.json"
          const ver = it.installed ? it.version : it.latest ?? it.version
          return [
            where,
            [`{`, `  <span class="k">"plugin"</span>: [`, `    <span class="s">"vector-plugin-conventional-commits"</span>,`, `__ADD__    <span class="s">"${esc(it.spec)}@${ver}"</span>`, `  ]`, `}`].filter((l) => it.id !== "conventional-commits" || !l.startsWith("__ADD__")),
          ]
        }

        function renderDetail() {
          const it = sel()
          const d = root.querySelector("[data-detail]")
          if (!it) {
            d.innerHTML = `<div class="p-empty">Select something to see what it does.</div>`
            return
          }
          const high = it.perms.filter((p) => p.level === "high").length
          const med = it.perms.filter((p) => p.level === "med").length
          const src = sourceBlock(it)
          d.innerHTML = `
            <div class="pd-head">
              <span class="tile tile-lg">${glyph[it.kind](20)}</span>
              <span class="row-text">
                <span class="pd-title"><h3>${esc(it.name)}</h3><span class="badge">${kindLabel[it.kind]}</span>${it.installed ? `<span class="badge badge-green">Installed</span>` : ""}</span>
                <span class="pd-sub">by <b>${esc(it.author)}</b>${it.verified ? ` ${verified} verified` : " · community"} · ${it.version === "built in" || it.version === "local" ? it.version : `v${it.version}`}${it.installs !== "—" ? ` · ${it.installs} installs` : ""}</span>
              </span>
            </div>
            <div class="pd-actions" data-actions>${actions(it)}</div>
            <div class="pd-body scroll">
              <p>${esc(it.desc)}</p>
              ${
                it.latest && it.installed && it.changelog
                  ? `<div class="pd-sec"><div class="pd-sec-head"><h4 class="section-title">New in ${it.latest}</h4><span class="muted mono">${it.version} → ${it.latest}</span></div><ul class="notes">${it.changelog.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>`
                  : ""
              }
              <div class="pd-sec"><div class="pd-sec-head"><h4 class="section-title">Adds</h4></div>
                <div class="adds">${it.adds.map(([k, v]) => `<span class="add-chip"><span>${k}</span>${esc(v)}</span>`).join("")}</div></div>
              <div class="pd-sec"><div class="pd-sec-head"><h4 class="section-title">${it.installed ? "Permissions it has" : "Permissions it asks for"}</h4><span class="muted">${high ? `<span style="color:var(--red)">${high} sensitive</span>` : med ? `${med} to review` : "Nothing sensitive"}</span></div>
                <div class="perms">${it.perms
                  .map((p, i) => {
                    const open = state.openPerm.has(i)
                    return `<div class="perm"><button class="perm-btn" type="button" aria-expanded="${open}" data-perm="${i}">
                      <span class="risk ${p.level === "high" ? "is-high" : p.level === "med" ? "is-med" : ""}">${riskIcon[p.icon]}</span>
                      <span class="row-text"><span class="row-name">${esc(p.label)}</span><span class="row-sub mono">${esc(p.api)}</span></span>
                      ${p.tag ? `<span class="badge ${p.level === "high" ? "badge-red" : "badge-amber"}">${p.tag}</span>` : ""}
                      ${LabUI.svg("chevron-right", 14)}
                    </button>${open && p.detail ? `<p class="perm-detail">${esc(p.detail)}</p>` : ""}</div>`
                  })
                  .join("")}</div></div>
              ${
                src
                  ? `<div class="pd-sec"><div class="pd-sec-head"><h4 class="section-title">${it.kind === "plugin" ? (it.installed ? "Listed in" : "Will be added to") : "Source"}</h4><span class="muted mono">${esc(src[0])}</span></div>
                    <div class="code">${src[1].map((l, i) => `<code data-n="${i + 1}"${l.startsWith("__ADD__") && !it.installed ? ' class="is-add"' : ""}><span>${l.replace("__ADD__", "")}</span></code>`).join("")}</div></div>`
                  : ""
              }
              <div class="facts">
                <div><span>Kind</span><b>${it.kind}</b></div>
                <div><span>${it.kind === "plugin" ? "Package" : "Location"}</span><b title="${esc(it.spec)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.spec.replace("https://", ""))}</b></div>
                <div><span>Scope</span><b>${it.builtin ? "built in" : it.installed ? (it.scope === "global" ? "everywhere" : it.discovered ? ".claude" : "project") : "—"}</b></div>
              </div>
            </div>`
          LabUI.renderIcons(d)
        }

        function renderAll() {
          renderViews()
          renderRail()
          renderList()
          renderDetail()
          LabUI.renderIcons(root.querySelector(".app-body"))
        }

        let toastTimer
        function toast(text) {
          const t = root.querySelector("[data-toast]")
          t.innerHTML = `${check}<span>${esc(text)}</span>`
          t.hidden = false
          clearTimeout(toastTimer)
          toastTimer = setTimeout(() => (t.hidden = true), 2600)
        }

        function runInstall(it, update) {
          state.install = { id: it.id, step: 0, update }
          renderList()
          renderDetail()
          LabUI.renderIcons(root.querySelector("[data-list]"))
          const advance = () => {
            state.install.step++
            if (state.install.step < 3) {
              if (state.sel === it.id) {
                root.querySelector("[data-actions]").innerHTML = actions(it)
                LabUI.renderIcons(root.querySelector("[data-actions]"))
              }
              return setTimeout(advance, 650)
            }
            state.install = null
            if (update) {
              it.version = it.latest
              delete it.latest
            }
            it.installed = true
            it.enabled = true
            it.scope = it.scope ?? state.scope
            renderAll()
            toast(update ? `${it.name} updated to ${it.version}` : `${it.name} installed · active in new sessions`)
          }
          setTimeout(advance, 650)
        }

        // ---------- Events ----------

        root.addEventListener("click", (e) => {
          const t = e.target
          if (t.closest(".switch")) return
          const view = t.closest("[data-view]")
          if (view) {
            state.view = view.dataset.view
            state.cat = "all"
            const first = visible()[0]
            if (first && !visible().includes(sel())) state.sel = first.id
            state.confirm = false
            renderAll()
            return
          }
          const cat = t.closest("[data-cat]")
          if (cat) {
            state.cat = cat.dataset.cat
            renderRail()
            renderList()
            LabUI.renderIcons(root.querySelector("[data-list]"))
            return
          }
          const pick = t.closest("[data-pick]")
          if (pick) {
            state.sel = pick.dataset.pick
            state.openPerm = new Set([0])
            state.confirm = false
            root.querySelectorAll("[data-item]").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.item === state.sel)))
            root.querySelectorAll(".feat").forEach((r) => r.setAttribute("aria-pressed", String(r.dataset.pick === state.sel)))
            renderDetail()
            return
          }
          const perm = t.closest("[data-perm]")
          if (perm) {
            const i = Number(perm.dataset.perm)
            state.openPerm.has(i) ? state.openPerm.delete(i) : state.openPerm.add(i)
            renderDetail()
            root.querySelector(`[data-perm="${i}"]`).focus()
            return
          }
          const act = t.closest("[data-act]")
          if (!act) return
          const it = sel()
          const a = act.dataset.act
          if (a === "install") runInstall(it, false)
          if (a === "update") runInstall(it, true)
          if (a === "update-all") {
            const ups = items.filter((i) => i.installed && i.latest)
            ups.forEach((u) => {
              u.version = u.latest
              delete u.latest
            })
            renderAll()
            toast(`${ups.length} updates installed`)
          }
          if (a === "ask-remove") {
            state.confirm = true
            renderDetail()
          }
          if (a === "cancel-remove") {
            state.confirm = false
            renderDetail()
          }
          if (a === "remove") {
            it.installed = false
            it.enabled = false
            delete it.latest
            state.confirm = false
            const name = it.name
            if (state.view !== "discover" && !visible().includes(it)) state.sel = visible()[0]?.id ?? state.sel
            renderAll()
            toast(`${name} uninstalled`)
          }
          if (a === "from-npm") {
            const q = root.querySelector("[data-q]")
            state.view = "discover"
            state.cat = "all"
            q.value = "@vectordev/"
            state.q = q.value
            renderAll()
            q.focus()
          }
          if (a === "new-skill") toast("Created .vector/skills/new-skill/SKILL.md")
        })

        root.addEventListener("lab:seg", (e) => {
          if (e.target.matches("[data-kinds]")) {
            state.kind = e.detail
            renderList()
            LabUI.renderIcons(root.querySelector("[data-list]"))
          }
          if (e.target.matches("[data-scope]")) {
            state.scope = e.detail
            renderDetail()
          }
        })

        root.addEventListener("lab:switch", (e) => {
          if (e.target.dataset.sw !== "enable") return
          const it = sel()
          it.enabled = e.detail
          renderList()
          renderRail()
          renderDetail()
          LabUI.renderIcons(root.querySelector("[data-list]"))
          toast(`${it.name} ${it.enabled ? "enabled" : "disabled"} · applies to new sessions`)
        })

        root.addEventListener("input", (e) => {
          if (!e.target.matches("[data-q]")) return
          state.q = e.target.value
          renderList()
          LabUI.renderIcons(root.querySelector("[data-list]"))
        })

        root.addEventListener("keydown", (e) => {
          if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.closest("[data-pick]")) {
            e.preventDefault()
            const all = [...root.querySelectorAll(".item-main")]
            const i = all.indexOf(e.target.closest("[data-pick]"))
            const next = all[i + (e.key === "ArrowDown" ? 1 : -1)]
            if (next) {
              next.click()
              next.focus()
            }
          }
        })

        renderAll()
      })()
    </script>
  </body>
</html>
