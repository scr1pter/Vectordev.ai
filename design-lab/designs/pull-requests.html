<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vector Design Lab</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/lab.css" />
    <style>
      /* D02 Pull Requests inbox. Everything is scoped under .d-pull-requests. */
      .d-pull-requests {
        --list: #1b1920;
        --detail: #17151c;
        --code: #141218;
      }

      .d-pull-requests button {
        font: inherit;
      }

      .d-pull-requests .hd-sub {
        color: var(--text-3);
        font-size: 12.5px;
      }

      .d-pull-requests .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 26px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text-2);
        font-size: 12px;
      }

      .d-pull-requests .live .dot-green {
        width: 6px;
        height: 6px;
        animation: pr-pulse 1.8s ease-in-out infinite;
      }

      @keyframes pr-pulse {
        50% {
          opacity: 0.4;
        }
      }

      .d-pull-requests .live .mono {
        color: var(--text-3);
        font-size: 11px;
      }

      .d-pull-requests .search {
        width: 260px;
        height: 28px;
      }

      .d-pull-requests .search svg {
        flex: none;
        color: var(--text-3);
      }

      .d-pull-requests .search input::placeholder {
        color: var(--text-3);
      }

      .d-pull-requests .pr {
        position: relative;
        display: flex;
        flex: 1;
        min-height: 0;
      }

      /* ---- list ---- */
      .d-pull-requests .pr-list {
        display: flex;
        flex: 0 0 488px;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--line);
        background: var(--list);
      }

      .d-pull-requests .pr-tool {
        display: flex;
        flex: none;
        align-items: center;
        gap: 10px;
        height: 47px;
        padding: 0 12px;
        border-bottom: 1px solid var(--hairline);
      }

      .d-pull-requests .pr-tool .seg button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .d-pull-requests .seg .n {
        color: var(--text-3);
        font: 10.5px var(--mono);
      }

      .d-pull-requests .pr-tool label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        color: var(--text-2);
        font-size: 12px;
      }

      .d-pull-requests .pr-scroll {
        flex: 1;
        min-height: 0;
        padding: 6px 8px 16px;
      }

      .d-pull-requests .grp {
        margin-top: 4px;
      }

      .d-pull-requests .grp-head {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 8px 0 6px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-2);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
      }

      .d-pull-requests .grp-head:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-1);
      }

      .d-pull-requests .grp-head svg.chev {
        color: var(--text-3);
        transition: transform 160ms ease;
      }

      .d-pull-requests .grp-head[aria-expanded="false"] svg.chev {
        transform: rotate(-90deg);
      }

      .d-pull-requests .grp-head .count {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
      }

      .d-pull-requests .grp-head .count.hot {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-pull-requests .grp-head .hint {
        margin-left: auto;
        color: var(--text-3);
        font-size: 11.5px;
        font-weight: 400;
      }

      .d-pull-requests .grp-ic {
        display: inline-grid;
        width: 16px;
        place-items: center;
      }

      .d-pull-requests .grp-body[hidden] {
        display: none;
      }

      .d-pull-requests .pr-row {
        position: relative;
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 7px 10px 7px 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--text-1);
        text-align: left;
        transition: background-color 120ms ease;
      }

      .d-pull-requests .pr-row:hover {
        background: rgba(255, 255, 255, 0.035);
      }

      .d-pull-requests .pr-row[aria-current="true"] {
        background: linear-gradient(90deg, rgba(182, 159, 247, 0.1), transparent 75%), rgba(255, 255, 255, 0.055);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
      }

      .d-pull-requests .pr-row[aria-current="true"]::before {
        content: "";
        position: absolute;
        inset: 10px auto 10px 0;
        width: 2px;
        border-radius: 2px;
        background: var(--violet-bright);
        box-shadow: 0 0 12px rgba(182, 159, 247, 0.42);
      }

      .d-pull-requests .pr-row.arrived {
        animation: pr-arrive 1.8s var(--ease);
      }

      @keyframes pr-arrive {
        0% {
          background: rgba(101, 199, 142, 0.18);
        }
      }

      .d-pull-requests .pr-row .row-text {
        gap: 3px;
      }

      .d-pull-requests .pr-row .row-sub {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .d-pull-requests .row-sub .mono {
        color: var(--text-2);
        font-size: 11px;
      }

      .d-pull-requests .pr-ic {
        display: grid;
        flex: none;
        width: 18px;
        place-items: center;
        align-self: flex-start;
        margin-top: 1px;
      }

      .d-pull-requests .ci {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--text-3);
        font: 10.5px var(--mono);
      }

      .d-pull-requests .vsp {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 20px;
        padding: 0 7px 0 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--text-2);
        font-size: 11px;
        white-space: nowrap;
      }

      .d-pull-requests .vsp i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-3);
      }

      .d-pull-requests .vsp.high i {
        background: var(--red);
      }

      .d-pull-requests .vsp.medium i {
        background: var(--amber);
      }

      .d-pull-requests .vsp.low i {
        background: var(--green);
      }

      .d-pull-requests .vsp.run {
        border-color: var(--violet-line);
        color: var(--violet-bright);
      }

      .d-pull-requests .avatar {
        display: inline-grid;
        flex: none;
        width: 18px;
        height: 18px;
        place-items: center;
        border-radius: 50%;
        background: #3b3346;
        color: #e5dcf5;
        font-size: 8.5px;
        font-weight: 600;
      }

      .d-pull-requests .avatar.agent {
        border-radius: 5px;
        background: var(--violet-soft);
        box-shadow: inset 0 0 0 1px var(--violet-line);
        color: var(--violet-bright);
      }

      .d-pull-requests .avatar.lg {
        width: 22px;
        height: 22px;
        font-size: 9.5px;
      }

      .d-pull-requests .stack {
        display: inline-flex;
      }

      .d-pull-requests .stack .avatar {
        box-shadow: 0 0 0 2px var(--detail);
      }

      .d-pull-requests .stack .avatar + .avatar {
        margin-left: -5px;
      }

      .d-pull-requests .tag {
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-2);
        font-size: 10.5px;
      }

      .d-pull-requests .tag.violet {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-pull-requests .empty {
        padding: 40px 20px;
        color: var(--text-3);
        font-size: 12.5px;
        text-align: center;
      }

      /* ---- detail ---- */
      .d-pull-requests .pr-detail {
        position: relative;
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        background: var(--detail);
      }

      .d-pull-requests .dt-head {
        display: grid;
        flex: none;
        gap: 8px;
        padding: 18px 24px 4px;
      }

      .d-pull-requests .dt-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        color: var(--text-3);
        font-size: 12px;
      }

      .d-pull-requests .dt-meta b {
        color: var(--text-2);
        font-weight: 500;
      }

      .d-pull-requests .dt-head h3 {
        margin: 0;
        color: var(--text-1);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.005em;
        line-height: 1.35;
      }

      .d-pull-requests .dt-refs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        color: var(--text-3);
        font-size: 12px;
      }

      .d-pull-requests .ref {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.035);
        color: var(--text-1);
        font: 11.5px var(--mono);
      }

      .d-pull-requests .dt-refs .add,
      .d-pull-requests .dt-refs .del {
        font-size: 12px;
      }

      .d-pull-requests .badge.merged {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-pull-requests .dt-tabs {
        flex: none;
        padding: 0 16px;
      }

      .d-pull-requests .tab .count {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
      }

      .d-pull-requests .tab[aria-selected="true"] .count {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-pull-requests .dt-body {
        flex: 1;
        min-height: 0;
        padding: 16px 24px 24px;
      }

      .d-pull-requests .status {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }

      .d-pull-requests .st-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 9px 14px;
      }

      .d-pull-requests .st-row + .st-row {
        border-top: 1px solid var(--hairline);
      }

      .d-pull-requests .st-ic {
        display: grid;
        flex: none;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-2);
      }

      .d-pull-requests .st-ic.green {
        background: var(--green-soft);
        color: var(--green);
      }

      .d-pull-requests .st-ic.red {
        background: var(--red-soft);
        color: var(--red);
      }

      .d-pull-requests .st-ic.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .d-pull-requests .st-ic.violet {
        background: var(--violet-soft);
        color: var(--violet-bright);
      }

      .d-pull-requests .st-row .row-text {
        gap: 2px;
      }

      .d-pull-requests .st-row .row-name {
        font-weight: 500;
      }

      .d-pull-requests .st-row .row-sub {
        font-size: 12px;
      }

      .d-pull-requests .bar {
        display: flex;
        gap: 2px;
        width: 120px;
      }

      .d-pull-requests .bar i {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
      }

      .d-pull-requests .bar i.ok {
        background: var(--green);
      }

      .d-pull-requests .bar i.fail {
        background: var(--red);
      }

      .d-pull-requests .bar i.run {
        background: var(--amber);
        animation: pr-pulse 1.2s ease-in-out infinite;
      }

      .d-pull-requests .desc {
        margin-top: 18px;
      }

      .d-pull-requests .desc h4 {
        margin: 0 0 8px;
        color: var(--text-3);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .d-pull-requests .desc p,
      .d-pull-requests .desc li {
        margin: 0 0 8px;
        color: var(--text-2);
        font-size: 13px;
        line-height: 1.6;
      }

      .d-pull-requests .desc ul {
        margin: 0 0 8px;
        padding-left: 18px;
      }

      .d-pull-requests code {
        padding: 1px 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-1);
        font: 0.92em var(--mono);
      }

      .d-pull-requests .agent-note {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding: 10px 12px;
        border: 1px solid rgba(182, 159, 247, 0.22);
        border-radius: 9px;
        background: rgba(146, 116, 236, 0.07);
        color: var(--text-2);
        font-size: 12.5px;
      }

      .d-pull-requests .agent-note b {
        color: var(--text-1);
        font-weight: 500;
      }

      .d-pull-requests .agent-note .btn {
        margin-left: auto;
      }

      .d-pull-requests .chk {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 6px 10px;
        border-radius: 7px;
      }

      .d-pull-requests .chk:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .d-pull-requests .chk .row-text {
        gap: 1px;
      }

      .d-pull-requests .chk .mono {
        color: var(--text-3);
        font-size: 11px;
      }

      .d-pull-requests .file {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 42px;
        padding: 5px 10px;
        border-radius: 7px;
      }

      .d-pull-requests .file:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .d-pull-requests .file .row-text {
        gap: 1px;
      }

      .d-pull-requests .file .add,
      .d-pull-requests .file .del {
        font-size: 12px;
      }

      .d-pull-requests .sum {
        display: flex;
        gap: 10px;
        padding: 0 10px 10px;
        color: var(--text-2);
      }

      .d-pull-requests .sum span:first-child {
        flex: 1;
      }

      .d-pull-requests .tl {
        position: relative;
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .d-pull-requests .tl::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 13px;
        width: 1px;
        background: var(--line);
      }

      .d-pull-requests .tl li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 38px;
        color: var(--text-2);
        font-size: 12.5px;
      }

      .d-pull-requests .tl li b {
        color: var(--text-1);
        font-weight: 500;
      }

      .d-pull-requests .tl .node {
        z-index: 1;
        display: grid;
        flex: none;
        width: 27px;
        height: 27px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--detail);
        color: var(--text-3);
      }

      .d-pull-requests .tl .when {
        margin-left: auto;
        color: var(--text-3);
        font-size: 11.5px;
      }

      .d-pull-requests .dt-foot {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        min-height: 56px;
        padding: 0 16px 0 24px;
        border-top: 1px solid var(--hairline);
        background: #1a1820;
      }

      .d-pull-requests .dt-foot .note {
        flex: 1;
        overflow: hidden;
        color: var(--text-3);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d-pull-requests .btn svg {
        flex: none;
      }

      .d-pull-requests .btn-merge {
        border-color: rgba(101, 199, 142, 0.5);
        background: #3f9a67;
        color: #fff;
      }

      .d-pull-requests .btn-merge:hover {
        background: #47a872;
      }

      .d-pull-requests .btn[disabled] {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-3);
        cursor: not-allowed;
      }

      .d-pull-requests .spin svg,
      .d-pull-requests svg.spin {
        animation: pr-spin 0.9s linear infinite;
      }

      @keyframes pr-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .d-pull-requests .merged-card {
        display: grid;
        justify-items: center;
        gap: 10px;
        margin-top: 8px;
        padding: 26px 20px;
        border: 1px solid var(--violet-line);
        border-radius: 12px;
        background: radial-gradient(260px 120px at 50% 0%, rgba(182, 159, 247, 0.12), transparent 70%), var(--card);
        text-align: center;
      }

      .d-pull-requests .merged-card h4 {
        margin: 0;
        color: var(--text-1);
        font-size: 14px;
        font-weight: 600;
      }

      .d-pull-requests .merged-card p {
        margin: 0;
        color: var(--text-2);
        font-size: 12.5px;
      }

      .d-pull-requests .toast {
        position: absolute;
        right: 18px;
        bottom: 72px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 460px;
        padding: 11px 14px;
        color: var(--text-1);
        font-size: 12.5px;
        animation: pr-pop 180ms var(--ease);
      }

      .d-pull-requests .toast[hidden] {
        display: none;
      }

      .d-pull-requests .toast .mono {
        color: var(--violet-bright);
      }

      @keyframes pr-pop {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
    </style>
  </head>
  <body>
    <div class="lab-page">
      <header data-lab-topbar data-slug="pull-requests"></header>

      <div class="lab-window">
        <div class="lab-bar">
          <span class="lab-traffic" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="lab-bar-title">Vector</span>
          <span class="lab-bar-end"><i></i> Concept</span>
        </div>
        <div class="lab-viewport" data-height="900">
          <div class="lab-stage d-pull-requests">
            <div class="app">
              <nav data-lab-sidebar data-active="pulls" data-workspace="Vector" data-branch="main"></nav>
              <main class="app-main">
                <header class="app-header">
                  <i data-icon="pulls" data-size="15" class="muted"></i>
                  <h2>Pull Requests</h2>
                  <span class="hd-sub" data-hd-sub></span>
                  <div class="app-header-end">
                    <span class="live" title="Synced with GitHub"><span class="dot dot-green"></span>Live<span class="mono" data-synced>synced 2s ago</span></span>
                    <label class="input search"><i data-icon="magnifier" data-size="14"></i><input type="search" placeholder="Search by title, number, branch or author" aria-label="Search pull requests" data-search /><kbd>/</kbd></label>
                    <button class="btn btn-primary" type="button" data-new><i data-icon="plus" data-size="13"></i>New pull request</button>
                  </div>
                </header>

                <div class="pr">
                  <section class="pr-list" aria-label="Open pull requests">
                    <div class="pr-tool">
                      <div class="seg" role="group" aria-label="Repository" data-repos></div>
                      <label>Drafts <button class="switch" role="switch" type="button" aria-checked="true" data-drafts aria-label="Show drafts"></button></label>
                    </div>
                    <div class="pr-scroll scroll" data-list></div>
                  </section>

                  <section class="pr-detail" aria-label="Pull request" data-detail></section>
                  <div class="toast float" role="status" data-toast hidden></div>
                </div>
              </main>
            </div>
          </div>
        </div>
      </div>

      <p class="lab-note" data-lab-note></p>
    </div>

    <script src="../assets/icons.js"></script>
    <script src="../assets/links.js"></script>
    <script src="../assets/registry/review.js"></script>
    <script src="../assets/registry/connections.js"></script>
    <script src="../assets/registry/settings.js"></script>
    <script src="../assets/registry/agents.js"></script>
    <script src="../assets/lab.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const root = document.querySelector(".d-pull-requests")
        const $ = (sel) => root.querySelector(sel)
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
        const svg = (body, size = 14, cls = "") =>
          `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`
        const tint = (color, html) => `<span style="color:${color};display:inline-grid">${html}</span>`
        const IC = {
          ok: (s = 14) => tint("var(--green)", svg('<circle cx="8" cy="8" r="5.9"/><path d="m5.6 8.1 1.7 1.7 3.1-3.4"/>', s)),
          fail: (s = 14) => tint("var(--red)", svg('<circle cx="8" cy="8" r="5.9"/><path d="m6 6 4 4m0-4-4 4"/>', s)),
          run: (s = 14) => tint("var(--amber)", svg('<circle cx="8" cy="8" r="5.9" opacity=".3"/><path d="M8 2.1a5.9 5.9 0 0 1 5.9 5.9"/>', s, "spin")),

          return `
            <div class="status">
              <div class="st-row"><span class="st-ic ${reviewIc}">${IC.people(15)}</span><span class="row-text"><span class="row-name">Reviews</span><span class="row-sub">${reviewText}</span></span>${people.length ? `<span class="stack">${people.map((x) => avatar(x, "lg")).join("")}</span>` : ""}</div>
              <div class="st-row"><span class="st-ic ${vsIc}">${p.vs.risk === "run" ? IC.run(15).replace("var(--amber)", "var(--violet-bright)") : IC.vs(14)}</span><span class="row-text"><span class="row-name">Vectorscope</span><span class="row-sub">${p.vs.risk === "run" ? "Reviewing the head commit · review + security" : `Risk ${p.vs.risk[0].toUpperCase() + p.vs.risk.slice(1)} · ${p.vs.text}`}</span></span>${p.n === 2318 ? `<a class="btn btn-sm" href="${LabUI.page("designs/vectorscope-review")}">Open review ${IC.arrow(12)}</a>` : p.vs.risk === "run" ? "" : `<button class="btn btn-sm btn-ghost" type="button" data-dtab="checks">Details</button>`}</div>
              <div class="st-row"><span class="st-ic ${ciIc}">${ci.fail ? IC.fail(15) : ci.run ? IC.run(15) : IC.ok(15)}</span><span class="row-text"><span class="row-name">Checks</span><span class="row-sub">${failing ? `<span style="color:#f0b0b3">${esc(failing.name)}</span> · ` : ""}${ciText}</span></span><span class="bar" aria-hidden="true">${p.checkList
                .filter((c) => c.name !== "Vectorscope")
                .map((c) => `<i class="${c.state}"></i>`)
                .join("")}</span></div>
              <div class="st-row"><span class="st-ic ${blocked ? "" : "green"}">${IC.merged(15)}</span><span class="row-text"><span class="row-name">Merge</span><span class="row-sub">${blocked ?? "No conflicts with main · ready to merge"}</span></span>${blocked ? "" : `<div class="seg" role="group" aria-label="Merge strategy" data-strategy>${["squash", "merge", "rebase"].map((s) => `<button type="button" data-value="${s}" aria-pressed="${state.strategy === s}">${s === "squash" ? "Squash" : s === "merge" ? "Merge commit" : "Rebase"}</button>`).join("")}</div>`}</div>
            </div>
            ${
              state.fixing.has(p.n)
                ? `<div class="agent-note">${tint("var(--violet-bright)", IC.spark(15))}<span><b>Vector is fixing ${esc(failing?.name ?? "CI")}</b> in a Parallel Workspace on <span class="mono">${esc(p.head)}</span></span><span class="spin" style="display:grid;margin-left:auto;color:var(--violet-bright)">${svg('<circle cx="8" cy="8" r="5.6" opacity=".3"/><path d="M8 2.4A5.6 5.6 0 0 1 13.6 8"/>', 14)}</span></div>`
                : p.session
                  ? `<div class="agent-note">${tint("var(--violet-bright)", IC.chip(15))}<span>Opened by the <b>${esc(p.author.slice(6))}</b> workspace from the session “${esc(p.session)}”.</span><button class="btn btn-sm" type="button">Open session</button></div>`
                  : ""
            }
            <div class="desc"><h4>Description</h4>${p.body.map((t) => `<p>${t}</p>`).join("")}${p.bullets.length ? `<ul>${p.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>` : ""}</div>`
        }

        function mergeBlock(p) {
          const ci = ciOf(p)
          if (p.draft) return "Draft · mark it ready for review to merge"
          if (p.vs.blocking) return "Blocked · a blocking Vectorscope finding stands"
          if (ci.fail) return "Blocked · required checks are failing"
          if (ci.run) return "Waiting for checks to finish"
          if (p.review !== "approved") return "Waiting for an approving review"
          return null
        }

        function checksHtml(p) {
          return p.checkList
            .map((c) => {
              const icon = c.state === "ok" ? IC.ok() : c.state === "fail" ? IC.fail() : c.state === "run" ? (c.name === "Vectorscope" ? IC.run().replace("var(--amber)", "var(--violet-bright)") : IC.run()) : `<span class="avatar agent" style="width:16px;height:16px">${IC.vs(10)}</span>`
              const sub = c.name === "Vectorscope" ? "Vectorscope GitHub App · review + security" : c.name.startsWith("brew") ? "GitHub Actions · tests.yml" : p.repo === "vectorscope-action" ? "GitHub Actions · ci.yml" : c.name.startsWith("e2e") ? "GitHub Actions · e2e.yml" : c.name.startsWith("build") ? "GitHub Actions · release.yml" : "GitHub Actions · ci.yml"
              const end = c.state === "vs" ? vsPill(p) : c.state === "run" ? `<span class="mono">${fmt(c.secs)}</span>` : `<span class="mono">${fmt(c.secs)}</span>`
              const log = c.state === "fail" && p.failLog ? `<div style="margin:0 10px 8px 34px;padding:8px 10px;border:1px solid rgba(255,255,255,.06);border-radius:7px;background:var(--code);color:#f0b0b3;font:11px/17px var(--mono);white-space:pre-wrap">${esc(p.failLog)}</div>` : ""
              return `<div class="chk">${icon}<span class="row-text"><span class="row-name">${esc(c.name)}</span><span class="row-sub">${sub}</span></span>${end}</div>${log}`
            })
            .join("")
        }
        const fmt = (s) => (s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`)

        function filesHtml(p) {
          return `<p class="sum"><span>${p.files.length} files changed</span><span class="add">+${p.add}</span><span class="del">−${p.del}</span></p>${p.files
            .map(([name, dir, a, d]) => `<div class="file"><span class="row-text"><span class="row-name">${name}</span><span class="row-sub">${dir || "repository root"}</span></span><span class="add">+${a}</span><span class="del">−${d}</span></div>`)
            .join("")}`
        }

        function activityHtml(p) {
          const items = [
            [avatar(p.author), `<b>${esc(authorName(p.author))}</b> opened this pull request`, `${p.age} ago`],
            [IC.commit(13), `<b>${p.commits} commit${p.commits === 1 ? "" : "s"}</b> pushed to <span class="mono">${esc(p.head)}</span>`, `${p.age} ago`],
            [IC.vs(12), p.vs.risk === "run" ? `<b>Vectorscope</b> is reviewing the head commit` : `<b>Vectorscope</b> reviewed · Risk ${p.vs.risk} · ${p.vs.text}`, p.vs.risk === "run" ? "now" : "8m ago"],
            ...p.approvals.map((a) => [avatar(a), `<b>${a}</b> approved these changes`, "6m ago"]),
            ...(p.review === "requested" ? [[IC.eye(13), `<b>${p.author === ME ? "You" : esc(authorName(p.author))}</b> requested a review from <b>you</b>`, "5m ago"]] : []),
          ]
          return `<ul class="tl">${items.map(([n, t, w]) => `<li><span class="node">${n}</span><span>${t}</span><span class="when">${w}</span></li>`).join("")}</ul>`
        }

        function foot(p) {
          const ci = ciOf(p)
          const blocked = mergeBlock(p)
          if (p.review === "requested")
            return `<span class="note">${p.n === 2318 ? "Vectorscope found 1 blocking issue; Approve stays off until it is resolved." : "Review the changes, then approve or request changes."}</span>
              <button class="btn" type="button" data-checkout="${p.n}">Check out</button>
              ${p.n === 2318 ? `<a class="btn btn-primary" href="${LabUI.page("designs/vectorscope-review")}">${IC.vs(12)}Review in Vectorscope</a>` : `<button class="btn btn-primary" type="button" data-approve="${p.n}">${IC.check(11)}Approve</button>`}`
          if (ci.fail && !state.fixing.has(p.n))
            return `<span class="note">${esc(p.checkList.find((c) => c.state === "fail").name)} failed on the latest push.</span><button class="btn" type="button" data-dtab="checks">View log</button><button class="btn btn-primary" type="button" data-fixci="${p.n}">${IC.spark(13)}Fix CI with agent</button>`
          if (state.fixing.has(p.n)) return `<span class="note">Vector will push a fix and re-run the failing check.</span><button class="btn" type="button" data-stopfix="${p.n}">Stop</button>`
          if (!blocked) {
            const label = state.strategy === "squash" ? "Squash and merge" : state.strategy === "merge" ? "Create merge commit" : "Rebase and merge"
            return state.confirm
              ? `<span class="note">Merge <span class="mono">${esc(p.head)}</span> into main with a ${state.strategy} and delete the branch?</span><button class="btn" type="button" data-cancel-merge>Cancel</button><button class="btn btn-merge" type="button" data-merge="${p.n}">${IC.merged(14)}Confirm ${state.strategy}</button>`
              : `<span class="note">Approved, green, and no blocking findings.</span><button class="btn btn-merge" type="button" data-merge-ask="${p.n}">${IC.merged(14)}${label}</button>`
          }
          if (p.draft) return `<span class="note">${blocked}</span><button class="btn" type="button" data-ready="${p.n}">Ready for review</button>`
          return `<span class="note">${blocked}</span><button class="btn" type="button" data-checkout="${p.n}">Check out</button><button class="btn btn-merge" type="button" disabled>${IC.merged(14)}Squash and merge</button>`
        }

        function mergedHtml(p, m) {
          return `<div class="merged-card"><span class="st-ic violet" style="width:38px;height:38px;border-radius:11px">${IC.merged(20)}</span><h4>#${p.n} merged into main</h4><p>${m.strategy === "squash" ? "Squashed" : m.strategy === "merge" ? "Merged" : "Rebased"} as <span class="mono">${m.sha}</span> · <span class="mono">${esc(p.head)}</span> deleted</p></div>
            <div class="desc"><h4>What's next</h4><p>Vectorscope will watch main for follow-ups. ${p.author.startsWith("agent:") ? "The agent's Parallel Workspace was cleaned up." : ""}</p></div>`
        }

        function renderAll() {
          renderRepos()
          renderList()
          renderDetail()
        }

        let toastTimer
        function toast(html) {
          const t = $("[data-toast]")
          t.innerHTML = html
          t.hidden = false
          clearTimeout(toastTimer)
          toastTimer = setTimeout(() => (t.hidden = true), 3400)
        }

        function select(n) {
          if (state.current !== n) state.tab = "overview"
          state.current = n
          state.confirm = false
          renderList()
          renderDetail()
        }

        // ---------- events ----------
        root.addEventListener("click", (event) => {
          const t = event.target.closest("button, a")
          if (!t || t.tagName === "A") return
          const d = t.dataset
          if (d.value && t.closest("[data-repos]")) {
            state.repo = d.value
            renderRepos()
            return renderList()
          }
          if (d.value && t.closest("[data-strategy]")) {
            state.strategy = d.value
            state.confirm = false
            return renderDetail()
          }
          if (d.group) {
            state.collapsed.has(d.group) ? state.collapsed.delete(d.group) : state.collapsed.add(d.group)
            return renderList()
          }
          if (d.pr) return select(Number(d.pr))
          if (d.dtab) {
            state.tab = d.dtab
            return renderDetail()
          }
          if (d.mergeAsk) {
            state.confirm = true
            renderDetail()
            return $("[data-merge]")?.focus()
          }
          if ("cancelMerge" in d) {
            state.confirm = false
            return renderDetail()
          }
          if (d.merge) {
            const n = Number(d.merge)
            const sha = ["8c41d07", "d2a6f19", "5be0c83"][n % 3]
            state.merged.set(n, { sha, strategy: state.strategy })
            state.confirm = false
            renderAll()
            return toast(`${tint("var(--violet-bright)", IC.merged(15))}<span>Merged <span class="mono">#${n}</span> into main as <span class="mono">${sha}</span> and deleted the branch.</span>`)
          }
          if (d.undo) {
            state.merged.delete(Number(d.undo))
            return renderAll()
          }
          if (d.approve) {
            const p = prs.find((x) => x.n === Number(d.approve))
            p.review = "approved"
            p.approvals = [...p.approvals, ME]
            p.arrived = true
            renderAll()
            setTimeout(() => (p.arrived = false), 1900)
            const g = GROUPS.find((x) => x.id === groupOf(p))
            return toast(`${IC.ok(15)}<span>Approved <span class="mono">#${p.n}</span>. It moved to <b>${g.label}</b>.</span>`)
          }
          if (d.fixci) {
            const p = prs.find((x) => x.n === Number(d.fixci))
            state.fixing.add(p.n)
            renderAll()
            toast(`${tint("var(--violet-bright)", IC.spark(15))}<span>Vector is fixing <b>${esc(p.checkList.find((c) => c.state === "fail").name)}</b> on <span class="mono">${esc(p.head)}</span></span>`)
            p.fixTimer = setTimeout(() => {
              state.fixing.delete(p.n)
              p.checkList.forEach((c) => {
                if (c.state === "fail") {
                  c.state = "run"
                  c.secs = 0
                  c.after = "ok"
                }
              })
              p.ci = { run: p.checkList.filter((c) => c.state === "run").map((c) => c.name) }
              p.commits += 1
              renderAll()
              toast(`${IC.commit(15)}<span>Vector pushed <span class="mono">${p.n === 2316 ? "41e9a2b" : "c07d3f5"}</span> to <span class="mono">${esc(p.head)}</span>. Checks are re-running.</span>`)
            }, 3200)
            return
          }
          if (d.stopfix) {
            const p = prs.find((x) => x.n === Number(d.stopfix))
            clearTimeout(p.fixTimer)
            state.fixing.delete(p.n)
            return renderAll()
          }
          if (d.ready) {
            const p = prs.find((x) => x.n === Number(d.ready))
            p.draft = false
            renderAll()
            return toast(`${IC.ok(15)}<span><span class="mono">#${p.n}</span> is ready for review.</span>`)
          }
          if (d.checkout) return toast(`${LabUI.svg("branch", 15)}<span>Checked out <span class="mono">#${d.checkout}</span> in a new Parallel Workspace.</span>`)
          if ("new" in d) return toast(`${IC.pr(15)}<span>Start a pull request from the Changes panel's <b>Ship</b> tab (D03).</span>`)
        })

        $("[data-search]").addEventListener("input", (event) => {
          state.q = event.target.value
          renderList()
        })
        root.addEventListener("lab:switch", (event) => {
          if (!event.target.matches("[data-drafts]")) return
          state.drafts = event.detail
          renderRepos()
          renderList()
        })
        document.addEventListener("keydown", (event) => {
          const typing = event.target.closest("input, textarea")
          if (event.key === "/" && !typing) {
            event.preventDefault()
            return $("[data-search]").focus()
          }
          if (typing) {
            if (event.key === "Escape") {
              event.target.value = ""
              state.q = ""
              renderList()
              event.target.blur()
            }
            return
          }
          if (!["ArrowDown", "ArrowUp", "j", "k"].includes(event.key)) return
          if (!event.target.closest(".d-pull-requests") && event.target !== document.body) return
          event.preventDefault()
          const rows = [...root.querySelectorAll(".grp-body:not([hidden]) .pr-row")]
          const at = rows.findIndex((r) => Number(r.dataset.pr) === state.current)
          const next = rows[Math.max(0, Math.min(rows.length - 1, at + (event.key === "ArrowDown" || event.key === "j" ? 1 : -1)))]
          if (!next) return
          select(Number(next.dataset.pr))
          root.querySelector(`[data-pr="${next.dataset.pr}"]`)?.focus()
        })

        // Live: checks tick, finish, and pull requests move between groups as they do.
        let synced = 2
        setInterval(() => {
          synced = synced >= 9 ? 1 : synced + 1
          $("[data-synced]").textContent = `synced ${synced}s ago`
          let moved = null
          let touched = false
          prs.forEach((p) => {
            const before = groupOf(p)
            let changed = false
            p.checkList.forEach((c) => {
              if (c.state !== "run") return
              c.secs += 1
              changed = true
              if (p.n === state.current && state.tab === "checks") touched = true
              const done = c.after ? c.secs >= 6 : p.live ? c.secs >= (c.name.startsWith("e2e") ? 7 : 11) : p.n === 2324 ? c.secs >= 13 + c.name.length / 4 : p.n === 57 ? c.secs >= 16 : false
              if (!done) return
              if (p.n === state.current) touched = true
              c.state = c.name === "Vectorscope" ? "vs" : "ok"
              if (c.name === "Vectorscope") p.vs = { risk: "low", text: "1 nit", blocking: 0 }
            })
            if (p.n === 2324 && p.checkList.every((c) => c.name === "Vectorscope" || c.state === "ok")) {
              const vs = p.checkList.find((c) => c.name === "Vectorscope")
              if (vs.state === "run") {
                vs.state = "vs"
                p.vs = { risk: "low", text: "1 nit", blocking: 0 }
              }
            }
            if (changed) {
              p.ci = { fail: p.checkList.filter((c) => c.state === "fail").map((c) => c.name), run: p.checkList.filter((c) => c.state === "run" && c.name !== "Vectorscope").map((c) => c.name) }
              const after = groupOf(p)
              if (after !== before) {
                p.arrived = true
                moved = p
                setTimeout(() => (p.arrived = false), 1900)
              }
            }
          })
          // Redraw only what changed, and put focus back where it was.
          const focused = document.activeElement
          const key = focused && root.contains(focused) ? [...Object.entries(focused.dataset)][0] : null
          renderList()
          if (touched) {
            const scroll = $(".dt-body")?.scrollTop ?? 0
            renderDetail()
            if ($(".dt-body")) $(".dt-body").scrollTop = scroll
          }
          if (key && !root.contains(focused)) root.querySelector(`[data-${key[0].replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}="${key[1]}"]`)?.focus()
          if (moved) {
            const g = GROUPS.find((x) => x.id === groupOf(moved))
            if (g.id === "ready") state.collapsed.delete("ready")
            renderList()
            toast(`${IC.ok(15)}<span><span class="mono">#${moved.n}</span> ${g.id === "ready" ? "is green and approved: moved to <b>Ready to merge</b>" : `moved to <b>${g.label}</b>`}</span>`)
          }
        }, 1000)

        renderAll()
      })
    </script>
  </body>
</html>
