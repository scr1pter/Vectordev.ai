# Temporary: diagnoses a Windows-only plugin SDK test failure on this branch. Removed in the next commit.
name: windows-diag
on:
  push:
    branches: [claude/ecstatic-ride-uml9of]
    paths: [.github/workflows/windows-diag.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun
      - run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"
      - run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream
      - name: Plugin SDK tests alone
        continue-on-error: true
        working-directory: packages/engine
        env:
          VECTOR_DIAG: "1"
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/config/dependencies.test.ts
      - name: Plugin SDK tests after the shard 1 prefix
        continue-on-error: true
        working-directory: packages/engine
        env:
          VECTOR_DIAG: "1"
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: |
          GITHUB_ACTIONS=false bun test --timeout 30000 --only-failures \
            src/tool/shell/sandbox.test.ts test/acp/directory.test.ts test/acp/service-session.test.ts test/agent/agent.test.ts \
            test/auth/auth.test.ts test/cli/acp/initialize-auth.test.ts test/cli/cmd/tui/attention.test.ts test/cli/github-remote.test.ts \
            test/cli/github.git.test.ts test/cli/github.route-script.test.ts test/cli/help/help-snapshots.test.ts \
            test/cli/plugin-auth-picker.test.ts test/cli/run/entry.body.test.ts test/cli/run/model-setup.test.ts \
            test/cli/run/question.shared.test.ts test/cli/run/runtime.queue.test.ts test/cli/run/session-data.test.ts \
            test/cli/run/stream.transport.test.ts test/cli/serve/serve-process.test.ts test/cli/tui/attach.test.ts \
            test/cli/tui/plugin-install.test.ts test/cli/tui/plugin-loader.test.ts test/compliance/bundled-provider-notices.test.ts \
            test/compliance/catalog-source.test.ts test/compliance/generated-artifacts.test.ts test/compliance/platform-notices.test.ts \
            test/compliance/runtime-notices.test.ts test/config/dependencies.test.ts
      - name: The real shard 1
        continue-on-error: true
        working-directory: packages/engine
        env:
          VECTOR_DIAG: "1"
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --only-failures --shard=1/4
