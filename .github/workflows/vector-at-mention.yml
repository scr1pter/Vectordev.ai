name: Vector at-mention

# The CI lane for the @vector build (docs/vector/build/vector-at-mention-spec.md, V00). test.yml and typecheck.yml run
# only on main and on pull requests, so this is the only CI a push to the build branch gets. Each later work package
# appends its test files to the step that owns them. The lane holds no repository secret or token: the checkout keeps
# no credential, and every service it talks to is a loopback fake or the Valkey container below.
on:
  push:
    branches:
      - vector-at-mention
  pull_request:
    # No other workflow runs the web GitHub tests, and they load shared api/_lib modules (http, abuse, persistent-store)
    # and jose, so any hosted API change, the lockfile and the Bun version in package.json start the lane. api/** takes
    # in the contract's api/github, api/cloud-agents, api/_lib/github-* and api/_lib/cloud-agents-* entries.
    paths:
      - api/**
      - bun.lock
      - package.json
      - packages/core/src/review/**
      - packages/core/src/github-agents.ts
      - packages/engine/src/cli/cmd/github*.ts
      - packages/desktop/src/main/github-*.ts
      - packages/web/test/github-*.ts
      - packages/web/test/cloud-agents-*.ts
      - packages/engine/test/cli/github*.ts
      - packages/engine/test/tool/registry*.ts
      - packages/core/test/github-agents.test.ts
      - packages/core/test/review/**
      - packages/core/test/child-environment.test.ts
      - test/api-module-loading.test.ts
      - test/cli-token.test.ts
      - packages/cloud/src/workflow-compliance.test.ts
      - .github/workflows/vector-at-mention.yml
  workflow_dispatch:

concurrency:
  # Pull requests share a group and cancel stale runs. Every push and dispatch gets a group of its own, so a newer push
  # never cancels or drops an older one: each package's commit keeps the result its done-criteria cite.
  # Expressions have no ternary, so this is the `&&`/`||` idiom; it is safe here only because both format() results are
  # non-empty strings and can never read as falsy.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api:
    name: hosted API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:7.2.14-alpine@sha256:c6c2f0020be34bbf684a53a0ef716ab16ff70295186d4d9f2518435beb7afbff
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # The hosted API in api/ is checked against the root tsconfig.json, which includes only api/**.
      - name: Typecheck hosted API
        working-directory: packages/engine
        run: bun typecheck --project ../../tsconfig.json

      # Without VECTOR_TEST_REDIS_URL, github-app-api.test.ts registers a single skipped test and the step still passes.
      # The cloud-agents API tests run here too, named by a glob: Codium's A59 deletes cloud-agents-entitlement.test.ts
      # (contract 2.3), and the glob keeps this step and the lane policy valid without an edit from it.
      - name: Run GitHub API tests
        if: ${{ !cancelled() }}
        working-directory: packages/web
        env:
          VECTOR_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/github-oidc.test.ts test/github-app.test.ts test/github-app-api.test.ts test/cloud-agents-*.test.ts

      # The repo-root test/ suite is not a workspace; these files cover the hosted API's module loading and CLI tokens.
      - name: Run hosted API tests
        if: ${{ !cancelled() }}
        working-directory: test
        run: GITHUB_ACTIONS=false bun test --timeout 30000 api-module-loading.test.ts cli-token.test.ts

      # test.yml does not run on this branch's pushes, so the lane checks its own policy.
      - name: Check the lane policy
        if: ${{ !cancelled() }}
        working-directory: packages/cloud
        run: GITHUB_ACTIONS=false bun test --timeout 30000 src/workflow-compliance.test.ts

  packages:
    name: engine and core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep && rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      # Bash expands the globs, so a pattern that matches nothing reaches bun as a literal filter. The lane policy in
      # packages/cloud/src/workflow-compliance.test.ts requires every pattern to match a file.
      - name: Run engine GitHub tests
        timeout-minutes: 20
        working-directory: packages/engine
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/cli/github*.test.ts test/tool/registry*.test.ts

      - name: Run core GitHub tests
        if: ${{ !cancelled() }}
        working-directory: packages/core
        run: GITHUB_ACTIONS=false bun test --timeout 30000 test/github-agents.test.ts test/review/*.test.ts test/child-environment.test.ts

  # The desktop runs the engine's Node bundle in Electron's utility process, while every engine test runs on Bun, so a
  # stray Bun API passes them all and still fails every desktop message. This boots the bundle under Node and sends
  # one prompt through a Read tool call against a fake model, as test.yml's desktop-engine-node job does.
  node-bundle:
    name: desktop engine bundle (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build the desktop engine bundle
        working-directory: packages/engine
        run: |
          set -euo pipefail
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun script/build-node.ts

      - name: Smoke-test the bundle under Node
        working-directory: packages/engine
        timeout-minutes: 5
        run: node script/smoke-node-bundle.ts
