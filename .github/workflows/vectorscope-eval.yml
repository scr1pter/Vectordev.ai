name: vectorscope eval

# Scores Vectorscope's review prompt on the fixture set in script/vectorscope-eval with the models you list.
# Manual only: it spends OpenRouter credit. Add the repository secret OPENROUTER_API_KEY before running it.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated OpenRouter model ids, e.g. anthropic/claude-sonnet-4.5,openai/gpt-5"
        required: true
        type: string
      repeat:
        description: "Runs per fixture, 1-5 (repeat to see run-to-run variance)"
        required: true
        default: "1"
        type: string
      fixtures:
        description: "Comma-separated fixture names (empty for all ten)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vectorscope-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Score each model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELS: ${{ inputs.models }}
          REPEAT: ${{ inputs.repeat }}
          FIXTURES: ${{ inputs.fixtures }}
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the repository secret OPENROUTER_API_KEY (Settings → Secrets and variables → Actions) and run again."
            exit 1
          fi
          [[ "$REPEAT" =~ ^[1-5]$ ]] || { echo "::error::repeat must be 1 to 5"; exit 1; }
          [[ -z "$FIXTURES" || "$FIXTURES" =~ ^[a-z0-9,-]+$ ]] || { echo "::error::fixtures must be comma-separated fixture names"; exit 1; }
          mkdir -p "$RUNNER_TEMP/vectorscope-eval"
          status=0
          IFS=, read -ra models <<< "$MODELS"
          for model in "${models[@]}"; do
            model="$(echo "$model" | xargs)"
            [ -n "$model" ] || continue
            [[ "$model" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "::error::invalid model id: $model"; status=1; continue; }
            out="$RUNNER_TEMP/vectorscope-eval/$(echo "$model" | tr '/:' '__').json"
            args=(--model "$model" --repeat "$REPEAT" --out "$out")
            [ -z "$FIXTURES" ] || args+=(--fixture "$FIXTURES")
            {
              echo "### $model"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            bun script/vectorscope-eval/run.ts "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Keep the JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vectorscope-eval
          path: ${{ runner.temp }}/vectorscope-eval/
          if-no-files-found: ignore
          retention-days: 30
