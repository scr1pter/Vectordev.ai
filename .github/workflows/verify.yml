name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fixture coverage and remaining release gates: docs/vector/local-packet-capture.md.
  local-packet-capture:
    name: Vector Local desktop packet capture (30 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Install isolated capture and Electron dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends tcpdump tshark xvfb xauth iproute2 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libgtk-3-0t64 libasound2t64
          # Like the air-gap job below, allow sandboxed Chromium's user namespace on this disposable runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bun --no-env-file packages/desktop/node_modules/electron/install.js
      - name: Build this commit's desktop engine
        working-directory: packages/engine
        env:
          VECTOR_CHANNEL: prod
        run: |
          set -euo pipefail
          export VECTOR_VERSION="$(node -p 'require("../desktop/package.json").version')"
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun --no-env-file script/build-node.ts
      - name: Check packet evidence validation
        working-directory: packages/desktop
        run: bun --no-env-file test scripts/local-mode-capture-audit.test.ts
      - name: Compare a 30-minute desktop workload with its packet capture
        working-directory: packages/desktop
        run: xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" bash scripts/local-mode-capture-linux.sh "$RUNNER_TEMP/vector-local-capture"
      - name: Preserve capture evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-local-capture-${{ github.sha }}
          path: ${{ runner.temp }}/vector-local-capture/
          if-no-files-found: warn
          retention-days: 14

  website:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build website
        run: bun --cwd packages/web build

  # Vector Local with Web access None where the machine really has no network. Every file runs in a network namespace
  # with nothing but loopback: no route, no resolver and no proxy, so a part of Vector that still needed the network
  # fails here. The fake model server and the fake web are on 127.0.0.1.
  air-gap:
    name: Air gap (Vector Local, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      # Installed while the network is still there: ripgrep for the tests that search files, and bubblewrap for the
      # shell sandbox that Web access None requires on Linux. Ubuntu 24.04 limits the unprivileged user namespaces
      # bubblewrap needs, so this runner lifts that limit, and the check after it proves bubblewrap works.
      - name: Install ripgrep and bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-net --ro-bind / / true

      - name: Run the Vector Local tests with no network
        working-directory: packages/engine
        run: |
          set -euo pipefail
          for file in \
            test/local-mode/air-gap.test.ts \
            test/tool/shell-sandbox-local.test.ts \
            test/tool/research-offline.test.ts \
            test/local-mode/local-run.test.ts
          do
            echo "::group::$file"
            sudo unshare --net -- sh -c \
              'ip link set lo up && exec sudo -E -u "$1" env PATH="$2" GITHUB_ACTIONS=false bun test --timeout 30000 "$3"' \
              sh "$USER" "$PATH" "$file"
            echo "::endgroup::"
          done
