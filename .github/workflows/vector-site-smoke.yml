name: Vector production schema checks

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify public schema routes
        run: bun script/verify-deployed-schemas.ts https://vectordev.ai
