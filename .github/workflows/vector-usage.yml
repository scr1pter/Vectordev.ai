name: Vector usage counts integration

on:
  pull_request:
    paths:
      - api/_lib/usage.ts
      - api/usage/**
      - packages/schema/src/usage-summary.ts
      - packages/web/test/usage-sql.test.ts
      - docs/vector/owner-actions/sql/usage.sql
      - .github/workflows/vector-usage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: vector_shares_test
          POSTGRES_USER: vector_fixture
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vector_fixture -d vector_shares_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Verify the usage-count SQL the owner applies, through the API code
        working-directory: packages/web
        env:
          VECTOR_TEST_POSTGRES_URL: postgres://vector_fixture:fixture-only@127.0.0.1:5432/vector_shares_test
        run: bun test test/usage-sql.test.ts
