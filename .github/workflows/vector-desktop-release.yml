name: vector desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Match tag to desktop version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(jq -r .version packages/desktop/package.json)
          test "$TAG" = "v$version" || {
            echo "Release tag $TAG must match packages/desktop version v$version"
            exit 1
          }

  mac:
    name: macOS desktop apps
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop build
      - name: Package Apple Silicon and Intel builds
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop package -- --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-desktop-mac
          path: |
            packages/desktop/dist/vector-desktop-mac-arm64.dmg
            packages/desktop/dist/vector-desktop-mac-arm64.zip
            packages/desktop/dist/vector-desktop-mac-x64.dmg
            packages/desktop/dist/vector-desktop-mac-x64.zip
            packages/desktop/dist/latest-mac.yml
            packages/desktop/dist/*.blockmap

  windows:
    name: Windows desktop app
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: $env:OPENCODE_CHANNEL="prod"; bun run --cwd packages/desktop build
      - name: Package Windows installer
        run: $env:OPENCODE_CHANNEL="prod"; bun run --cwd packages/desktop package -- --win nsis --x64 --arm64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-desktop-windows
          path: |
            packages/desktop/dist/vector-desktop-win-x64.exe
            packages/desktop/dist/vector-desktop-win-arm64.exe
            packages/desktop/dist/vector-desktop-win.exe
            packages/desktop/dist/latest.yml
            packages/desktop/dist/*.blockmap

  linux:
    name: Linux desktop app
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop build
      - name: Package Linux AppImage
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop package -- --linux AppImage --x64 --arm64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-desktop-linux
          path: |
            packages/desktop/dist/vector-desktop-linux-x86_64.AppImage
            packages/desktop/dist/vector-desktop-linux-arm64.AppImage
            packages/desktop/dist/latest-linux.yml
            packages/desktop/dist/latest-linux-arm64.yml
            packages/desktop/dist/*.blockmap

  release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs:
      - mac
      - windows
      - linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 vector-desktop-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(gh release create "$TAG" release-assets/* --title "Vector ${TAG}" --notes "Vector desktop builds for macOS, Windows, and Linux.")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            "${args[@]}"
          fi
      - name: Publish Vector download and update feeds
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then
            channel=beta
          fi
          VECTOR_RELEASE_DIR="$PWD/release-assets" \
          VECTOR_RELEASE_VERSION="${TAG#v}" \
          VECTOR_RELEASE_CHANNEL="$channel" \
          bun packages/cloud/src/upload-desktop-release.ts
