name: vector desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Match tag to desktop version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(jq -r .version packages/desktop/package.json)
          test "$TAG" = "v$version" || {
            echo "Release tag $TAG must match packages/desktop version v$version"
            exit 1
          }
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Vector ${TAG}" --notes "Vector desktop builds for macOS, Windows, and Linux."
          fi

  mac:
    name: macOS desktop apps
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop build
      - name: Package Apple Silicon and Intel builds
        run: |
          for attempt in 1 2 3; do
            OPENCODE_CHANNEL=prod bun run --cwd packages/desktop package -- --mac dmg zip --arm64 --x64 --publish never && exit 0
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Upload macOS assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            packages/desktop/dist/vector-desktop-mac-arm64.dmg \
            packages/desktop/dist/vector-desktop-mac-arm64.dmg.blockmap \
            packages/desktop/dist/vector-desktop-mac-arm64.zip \
            packages/desktop/dist/vector-desktop-mac-arm64.zip.blockmap \
            packages/desktop/dist/vector-desktop-mac-x64.dmg \
            packages/desktop/dist/vector-desktop-mac-x64.dmg.blockmap \
            packages/desktop/dist/vector-desktop-mac-x64.zip \
            packages/desktop/dist/vector-desktop-mac-x64.zip.blockmap \
            packages/desktop/dist/latest-mac.yml

  windows:
    name: Windows desktop app
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: $env:OPENCODE_CHANNEL="prod"; bun run --cwd packages/desktop build
      - name: Package Windows installer
        shell: pwsh
        run: |
          $env:OPENCODE_CHANNEL = "prod"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun run --cwd packages/desktop package -- --win nsis --x64 --arm64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds ($attempt * 15)
          }
      - name: Preserve the stable Windows updater filename
        shell: pwsh
        run: |
          if (!(Test-Path packages/desktop/dist/vector-desktop-win.exe)) {
            Copy-Item packages/desktop/dist/vector-desktop-win-x64.exe packages/desktop/dist/vector-desktop-win.exe
          }
          if (!(Test-Path packages/desktop/dist/vector-desktop-win.exe.blockmap)) {
            Copy-Item packages/desktop/dist/vector-desktop-win-x64.exe.blockmap packages/desktop/dist/vector-desktop-win.exe.blockmap
          }
      - name: Upload Windows assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $assets = @(
            "packages/desktop/dist/vector-desktop-win-x64.exe",
            "packages/desktop/dist/vector-desktop-win-x64.exe.blockmap",
            "packages/desktop/dist/vector-desktop-win-arm64.exe",
            "packages/desktop/dist/vector-desktop-win-arm64.exe.blockmap",
            "packages/desktop/dist/vector-desktop-win.exe",
            "packages/desktop/dist/vector-desktop-win.exe.blockmap",
            "packages/desktop/dist/latest.yml"
          )
          gh release upload $env:TAG $assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux desktop app
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Build desktop app
        run: OPENCODE_CHANNEL=prod bun run --cwd packages/desktop build
      - name: Package Linux AppImage
        run: |
          for attempt in 1 2 3; do
            OPENCODE_CHANNEL=prod bun run --cwd packages/desktop package -- --linux AppImage --x64 --arm64 --publish never && exit 0
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Upload Linux assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            packages/desktop/dist/vector-desktop-linux-x86_64.AppImage \
            packages/desktop/dist/vector-desktop-linux-arm64.AppImage \
            packages/desktop/dist/latest-linux.yml \
            packages/desktop/dist/latest-linux-arm64.yml

  release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs:
      - mac
      - windows
      - linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Download platform assets from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --clobber
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 vector-desktop-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/checksums.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
      - name: Publish Vector download and update feeds
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then
            channel=beta
          fi
          VECTOR_RELEASE_DIR="$PWD/release-assets" \
          VECTOR_RELEASE_VERSION="${TAG#v}" \
          VECTOR_RELEASE_CHANNEL="$channel" \
          bun packages/cloud/src/upload-desktop-release.ts
