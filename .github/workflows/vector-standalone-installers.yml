name: Vector standalone installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/web/public/install*
      - packages/core/src/util/windows-powershell.ts
      - packages/core/test/util/windows-powershell.test.ts
      - packages/engine/src/installation/**
      - packages/engine/script/verify-windows-installer.ts
      - packages/engine/test/installation/**
      - .github/workflows/vector-standalone-installers.yml
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Verify nested native PowerShell commands
        working-directory: packages/core
        shell: pwsh
        run: bun test test/util/windows-powershell.test.ts
      - name: Compare native PowerShell from the Bash parent
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: bun test test/util/windows-powershell.test.ts
      - name: Compare native PowerShell without LOCALAPPDATA only
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: env -u LOCALAPPDATA bun test test/util/windows-powershell.test.ts
      - name: Compare native PowerShell without HOME only
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: env -u HOME bun test test/util/windows-powershell.test.ts
      - name: Verify nested native PowerShell commands through Turbo
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=strict --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Compare the same Turbo process with the inherited environment
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=loose --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Compare loose Turbo without the runner module cache only
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: env -u PSModuleAnalysisCachePath bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=loose --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Compare strict Turbo with the runner module cache restored only
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: |
          if [[ -z "${PSModuleAnalysisCachePath+x}" ]]; then
            echo "PSModuleAnalysisCachePath must exist in the runner environment for this comparison" >&2
            exit 1
          fi
          backup="$(mktemp)"
          cp ../../turbo.json "$backup"
          trap 'cp "$backup" ../../turbo.json; rm -f "$backup"' EXIT
          bun --no-env-file -e '
            const file = Bun.file("../../turbo.json")
            const config = await file.json()
            const task = config.tasks["@vectordevai/core#test"]
            if (!Array.isArray(task.passThroughEnv) || task.passThroughEnv.includes("PSModuleAnalysisCachePath"))
              throw new Error("Expected the unchanged strict Core environment before this comparison")
            task.passThroughEnv = [...task.passThroughEnv, "PSModuleAnalysisCachePath"]
            await Bun.write(file, JSON.stringify(config, null, 2) + "\n")
          '
          bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=strict --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Compare strict Turbo with LOCALAPPDATA restored only
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: |
          if [[ -z "${LOCALAPPDATA+x}" ]]; then
            echo "LOCALAPPDATA must exist in the runner environment for this comparison" >&2
            exit 1
          fi
          backup="$(mktemp)"
          cp ../../turbo.json "$backup"
          trap 'cp "$backup" ../../turbo.json; rm -f "$backup"' EXIT
          bun --no-env-file -e '
            const file = Bun.file("../../turbo.json")
            const config = await file.json()
            const task = config.tasks["@vectordevai/core#test"]
            if (!Array.isArray(task.passThroughEnv) || task.passThroughEnv.includes("LOCALAPPDATA"))
              throw new Error("Expected the unchanged strict Core environment before this comparison")
            task.passThroughEnv = [...task.passThroughEnv, "LOCALAPPDATA"]
            await Bun.write(file, JSON.stringify(config, null, 2) + "\n")
          '
          bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=strict --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Locate the native module import boundary under strict Turbo
        if: success() || failure()
        working-directory: packages/core
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
          VECTOR_WINDOWS_POWERSHELL_IMPORT_PROBE: "1"
        run: |
          backup="$(mktemp)"
          cp ../../turbo.json "$backup"
          trap 'cp "$backup" ../../turbo.json; rm -f "$backup"' EXIT
          bun --no-env-file -e '
            const file = Bun.file("../../turbo.json")
            const config = await file.json()
            const task = config.tasks["@vectordevai/core#test"]
            if (!Array.isArray(task.passThroughEnv) || task.passThroughEnv.includes("VECTOR_WINDOWS_POWERSHELL_IMPORT_PROBE"))
              throw new Error("Expected the unchanged strict Core environment before this comparison")
            task.passThroughEnv = [...task.passThroughEnv, "VECTOR_WINDOWS_POWERSHELL_IMPORT_PROBE"]
            await Bun.write(file, JSON.stringify(config, null, 2) + "\n")
          '
          bun --no-env-file ../../node_modules/turbo/bin/turbo run test --filter=@vectordevai/core --only --env-mode=strict --cache=local:w --log-order=stream -- test/util/windows-powershell.test.ts
      - name: Verify native installer identity and ownership
        if: success() || failure()
        working-directory: packages/engine
        shell: pwsh
        run: bun test test/installation/native-identity.test.ts test/installation/ownership.test.ts
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify the real PowerShell installer and running-executable replacement
        shell: pwsh
        env:
          VECTOR_INSTALLER_WINDOWS_FIXTURE: "1"
        run: bun packages/engine/script/verify-windows-installer.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-installer-evidence
          path: vector-windows-installer-evidence.json
