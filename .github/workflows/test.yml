name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      hands_benchmark:
        description: Run only the production app baseline for the desktop app-control work
        type: boolean
        required: false
        default: false

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  # Expressions have no ternary, so this is the `&&`/`||` idiom; it is safe here only
  # because both format() results are non-empty strings and can never read as falsy.
  # Manual benchmarks never cancel the normal checks for the same branch.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.hands_benchmark && format('{0}-hands-benchmark-{1}', github.workflow, github.ref) || (github.ref == 'refs/heads/main' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    if: github.event_name != 'workflow_dispatch' || !inputs.hands_benchmark
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep && rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        # The engine suite runs in its own shards below on both systems: whole, it took 22 minutes on Linux and Bun
        # 1.3.14 crashed in it (a segmentation fault in Bun itself) on 25 October 2026.
        timeout-minutes: 50
        run: GITHUB_ACTIONS=false bun turbo test --filter='!@vectordevai/engine' --log-order=stream --continue=dependencies-successful
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/engine
        run: bun run test:httpapi

      # The repo-root test/ suite covers the hosted API in api/ and its vercel.json routes. It is not a workspace,
      # so turbo skips it, and Vercel deploys main without waiting for the desktop release workflow that also runs it.
      - name: Run hosted API tests
        if: runner.os == 'Linux'
        working-directory: test
        run: GITHUB_ACTIONS=false bun test --only-failures

      # packages/web has no test script, so turbo skips its tests. This one keeps the site from calling a shipped
      # desktop release unpublished or telling people Vector cannot update itself.
      - name: Run website release copy tests
        if: runner.os == 'Linux'
        working-directory: packages/web
        run: GITHUB_ACTIONS=false bun test test/release-copy.test.ts

  # The desktop runs the engine's Node bundle in Electron's utility process, while every engine test runs on Bun, so a
  # stray Bun API passes them all and still fails every desktop message ("Bun is not defined", 1.99.99). This boots
  # the bundle under Node and sends one prompt through a Read tool call against a fake model.
  desktop-engine-node:
    if: github.event_name != 'workflow_dispatch' || !inputs.hands_benchmark
    name: desktop engine bundle (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the desktop engine bundle
        working-directory: packages/engine
        run: |
          set -euo pipefail
          export VECTOR_RELEASE_CATALOG_PATH="$PWD/../web/public/models/api.json"
          export VECTOR_RELEASE_CATALOG_SHA256="$(sha256sum "$VECTOR_RELEASE_CATALOG_PATH" | cut -d ' ' -f 1)"
          bun script/build-node.ts

      - name: Smoke-test the bundle under Node
        working-directory: packages/engine
        timeout-minutes: 5
        run: node script/smoke-node-bundle.ts

  engine-linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.hands_benchmark
    name: engine (linux, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep && rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Run Engine shard
        # Four shards keep each Bun process near a quarter of the suite; one process for all of it crashed in Bun.
        timeout-minutes: 30
        working-directory: packages/engine
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --shard=${{ matrix.shard }}/4
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"

  engine-windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.hands_benchmark
    name: engine (windows, shard ${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The engine suite runs under the strict network guard, so Vector may not download ripgrep for the tests that
      # search files: it has to be installed (engine/test/preload.ts).
      - name: Install ripgrep
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing ripgrep failed." }
          # Chocolatey's .NET shim cannot start from the long paths used by trusted skill snapshots.
          # Find the native executable in the installed package instead of invoking that shim.
          $tools = Join-Path $env:ChocolateyInstall 'lib\ripgrep\tools'
          $native = @(Get-ChildItem -LiteralPath $tools -Filter rg.exe -File -Recurse)
          if ($native.Count -ne 1) { throw "Expected one native ripgrep executable in $tools." }
          & ($native[0].FullName) --version
          if ($LASTEXITCODE -ne 0) { throw "The native ripgrep executable failed." }
          $native[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"

      - name: Build Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream

      - name: Run Engine shard
        # Six shards: with four, one shard needed 29 to 31 minutes on loaded hosted runners on 22 Oct, so whichever
        # test ran last timed out. Each shard now does about two thirds of that.
        timeout-minutes: 30
        working-directory: packages/engine
        # Whole-file shards retain the configured preloads and per-test deadlines; print passes to locate any stall.
        run: GITHUB_ACTIONS=false bun test --timeout 30000 --shard=${{ matrix.shard }}/6
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

  e2e:
    if: github.event_name != 'workflow_dispatch' || !inputs.hands_benchmark
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          # Five browser workers stalled asset loading on both hosted platforms; keep test deadlines intact.
          PLAYWRIGHT_WORKERS: "1"
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  hands-benchmark:
    name: production app benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.hands_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: true
      VECTOR_CHANNEL: prod
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PLAYWRIGHT_PORT: "4568"
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/hands-app-benchmark/report
      VECTOR_PERFORMANCE_RUN_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Match the documented production timeline workload; detailed profiling stays off.
      TIMELINE_CPU_THROTTLE: "4"
      TIMELINE_DELTA_COUNT: "40"
      TIMELINE_HISTORY_TURNS: "80"
      TIMELINE_EVENT_BATCH: "1"
      TIMELINE_CPU_PROFILE: "0"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout benchmark commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Keep the same Chromium extraction workaround as the ordinary e2e job.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Install Chromium and system dependencies
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Record benchmark provenance
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const os = require("node:os")
          const path = require("node:path")
          const { execFileSync } = require("node:child_process")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(path.join(directory, "manifest.json"), JSON.stringify({
            commit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            ref: process.env.GITHUB_REF,
            runID: process.env.VECTOR_PERFORMANCE_RUN_ID,
            node: process.version,
            bun: execFileSync("bun", ["--version"], { encoding: "utf8" }).trim(),
            playwright: execFileSync("bunx", ["playwright", "--version"], { encoding: "utf8" }).trim(),
            platform: process.platform,
            arch: process.arch,
            cpu: os.cpus()[0]?.model,
            cpuCount: os.availableParallelism(),
            memoryBytes: os.totalmem(),
            workers: 1,
            repeats: 3,
            channel: process.env.VECTOR_CHANNEL,
            timeline: { historyTurns: 80, deltas: 40, cpuThrottle: 4, eventBatch: 1, detailedProfiling: false },
          }, null, 2) + "\n")
          NODE

      - name: Measure production navigation and timeline
        working-directory: packages/app
        run: |
          set -euo pipefail
          # This config builds and serves dist, refuses a reused server, and runs serially. It uses HTTP fixtures;
          # no live engine or model account is needed. Repeat exactly these cases for the after-change comparison.
          bunx playwright test \
            --config e2e/performance/playwright.config.ts \
            e2e/performance/timeline/first-navigation-benchmark.spec.ts \
            e2e/performance/timeline/session-timeline-benchmark.spec.ts \
            --project=chromium --workers=1 --retries=0 --repeat-each=3 \
            --grep 'performance: first navigation paint|streams assistant text in v2 with review pane closed' \
            --output "$RUNNER_TEMP/hands-app-benchmark/results" \
            2>&1 | tee "$RUNNER_TEMP/hands-app-benchmark/run.log"

      - name: Extract structured measurements
        if: always()
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const directory = path.join(process.env.RUNNER_TEMP, "hands-app-benchmark")
          const log = path.join(directory, "run.log")
          if (!fs.existsSync(log)) process.exit(0)
          const metrics = fs.readFileSync(log, "utf8").split("\n").flatMap((line) => {
            const match = line.match(/BENCHMARK (\{.*\})/)
            return match ? [JSON.parse(match[1])] : []
          })
          fs.writeFileSync(path.join(directory, "metrics.json"), JSON.stringify(metrics, null, 2) + "\n")
          NODE

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hands-app-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hands-app-benchmark/
          if-no-files-found: warn
          retention-days: 30
