name: Vector Windows runtime comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/engine/test/lib/cli-process.ts
      - packages/engine/test/session/prompt.test.ts
      - packages/core/src/cross-spawn-spawner.ts
      - .github/workflows/vector-windows-runtime-probe.yml
permissions:
  contents: read
jobs:
  native-comparison:
    name: Native subprocess comparison (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [candidate, main]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate test fixtures
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Save identical diagnostic fixtures outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/vector-native-comparison"
          cp packages/engine/test/lib/cli-process.ts "$RUNNER_TEMP/vector-native-comparison/cli-process.ts"
          cp packages/engine/test/session/prompt.test.ts "$RUNNER_TEMP/vector-native-comparison/prompt.test.ts"
      - name: Check out the exact runtime under test
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.source == 'main' && '9252aba12694b8a6729a4b31cca0f4205e0d3e13' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record pristine runtime and install only test fixtures
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/vector-native-comparison/source.txt"
          git diff --exit-code
          test ! -e node_modules
          cp "$RUNNER_TEMP/vector-native-comparison/cli-process.ts" packages/engine/test/lib/cli-process.ts
          cp "$RUNNER_TEMP/vector-native-comparison/prompt.test.ts" packages/engine/test/session/prompt.test.ts
          git diff --exit-code -- 'packages/*/src/**'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun
      - name: Record runtime versions
        run: |
          { node --version; bun --version; } | tee "$RUNNER_TEMP/vector-native-comparison/versions.txt"
      - name: Configure local fixture git identity
        run: |
          git config --global user.email "bot@vectordev.ai"
          git config --global user.name "Vector"
      - name: Build this checkout's Engine test dependencies
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo run build --filter='@vectordevai/engine^...' --log-order=stream
      - name: Verify workspace import ownership and environment presence
        working-directory: packages/engine
        run: |
          set -o pipefail
          for mode in default browser; do
            flags=()
            if [ "$mode" = browser ]; then flags+=(--conditions=browser); fi
            VECTOR_PROBE_IMPORT_CONDITIONS="$mode" bun "${flags[@]}" - <<'TS' | tee "$RUNNER_TEMP/vector-native-comparison/imports-$mode.json"
          import { realpathSync } from "node:fs"
          import path from "node:path"
          import { fileURLToPath } from "node:url"
          import { untrustedChildEnvironment } from "@vectordevai/core/child-environment"
          const imports = [
            ["@vectordevai/core/process", "../core"],
            ["@vectordevai/core/cross-spawn-spawner", "../core"],
            ["@vectordevai/schema", "../schema"],
            ["@vectordevai/sdk/v2", "../sdk/js"],
          ].map(([specifier, directory]) => {
            const resolved = realpathSync(fileURLToPath(import.meta.resolve(specifier)))
            const expected = realpathSync(path.resolve(directory))
            if (!resolved.startsWith(expected + path.sep)) throw new Error(`Foreign workspace import: ${specifier}`)
            return { specifier, ownedBySelectedCheckout: true }
          })
          const child = untrustedChildEnvironment(process.env)
          const presence = ["PSModuleAnalysisCachePath", "PSModulePath", "COMSPEC", "PATHEXT", "HOME"].map((name) => ({
            name,
            parent: Object.keys(process.env).some((key) => key.toUpperCase() === name.toUpperCase()),
            child: Object.keys(child).some((key) => key.toUpperCase() === name.toUpperCase()),
          }))
          console.log(JSON.stringify({ conditions: process.env.VECTOR_PROBE_IMPORT_CONDITIONS, bun: Bun.version, imports, presence }))
          TS
          done
      - name: Exercise first and subsequent preferred-shell readiness
        working-directory: packages/engine
        env:
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: |
          set -o pipefail
          GITHUB_ACTIONS=false bun test --timeout 30000 test/session/prompt.test.ts -t 'loop waits while shell runs and starts after shell exits|shell completion resumes queued loop callers' 2>&1 | tee "$RUNNER_TEMP/vector-native-comparison/shell.log"
      - name: Exercise CLI JSON and permission semantics with partial-output evidence
        if: success() || failure()
        working-directory: packages/engine
        env:
          VECTOR_TEST_CLI_DIAGNOSTICS: "1"
          VECTOR_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: |
          set -o pipefail
          GITHUB_ACTIONS=false bun test --timeout 30000 test/cli/run/run-process.test.ts -t 'format json emits parseable line-delimited JSON|rejects requested permissions by default' 2>&1 | tee "$RUNNER_TEMP/vector-native-comparison/cli.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-subprocess-${{ matrix.source }}
          path: ${{ runner.temp }}/vector-native-comparison/
