<div id="vector-launch" class="vector-launch" data-state="veiled">
  <div class="vector-launch-ground" aria-hidden="true"></div>
  <div class="vector-launch-ghost" aria-hidden="true">
    <div class="vector-launch-ghost-nav"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="vector-launch-ghost-stage"><span></span><span></span><span class="vector-launch-ghost-composer"></span></div>
    <div class="vector-launch-ghost-panel"></div>
  </div>
  <div class="vector-launch-aurora" aria-hidden="true"></div>
  <div class="vector-launch-glass" aria-hidden="true"></div>
  <div class="vector-launch-stage">
    <div class="vector-launch-emblem" aria-hidden="true">
      <div class="vector-launch-halo"></div>
      <div class="vector-launch-tile">
        <!--vector-launch-mark-->
        <span class="vector-launch-sheen"></span>
      </div>
    </div>
    <p class="vector-launch-hint" data-vector-launch-hint aria-hidden="true">Still starting…</p>
    <div class="vector-launch-failure">
      <p>Vector didn’t finish starting.</p>
      <div class="vector-launch-actions">
        <button type="button" class="vector-launch-button" data-vector-launch-action="reload">Reload</button>
        <button type="button" class="vector-launch-button" data-variant="quiet" data-vector-launch-action="restart" hidden>Restart Vector</button>
      </div>
    </div>
  </div>
  <p class="vector-launch-sr" role="status" aria-live="polite" data-vector-launch-status></p>
</div>
